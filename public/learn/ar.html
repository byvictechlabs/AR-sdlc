<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR SDLC - Agile</title>

    <!-- A-Frame + MindAR -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            background: #0b1220;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        #app { position: fixed; inset: 0; }

        a-scene { width: 100%; height: 100%; }

        /* Sembunyikan UI bawaan A-Frame/MindAR */
        .a-orientation-modal,
        .a-scene-warning,
        .a-vr-button,
        .a-loader-title,
        a-scene .a-loader { display: none !important; }

        /* ===== START SCREEN ===== */
        #start-screen {
            position: absolute; inset: 0; z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; color: #fff; padding: 24px;
            background: linear-gradient(160deg, #2563eb, #4f46e5);
        }
        #start-screen .icon { font-size: 44px; margin-bottom: 16px; }
        #start-screen h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
        #start-screen p { font-size: 13px; opacity: .9; line-height: 1.6; max-width: 80%; }
        #start-screen p b { opacity: 1; }
        .btn-start {
            margin-top: 28px; background: #fff; color: #2563eb;
            border: none; padding: 14px 48px; border-radius: 50px;
            font-size: 15px; font-weight: 800; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,.2);
            transition: transform .15s;
        }
        .btn-start:active { transform: scale(.95); }

        /* ===== UI OVERLAY ===== */
        #ui-top {
            position: absolute; top: 0; left: 0; right: 0; z-index: 50;
            display: flex; align-items: center; gap: 10px; padding: 16px;
            pointer-events: none;
        }
        .btn-back {
            pointer-events: auto;
            display: flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,.92); border: none;
            padding: 9px 16px; border-radius: 30px;
            font-size: 13px; font-weight: 700; color: #1e293b; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,.15);
            text-decoration: none;
        }
        .title-pill {
            background: rgba(0,0,0,.55); color: #fff;
            padding: 8px 16px; border-radius: 30px;
            font-size: 13px; font-weight: 600; backdrop-filter: blur(4px);
        }

        #status-pill {
            position: absolute; bottom: 24px; left: 50%;
            transform: translateX(-50%); z-index: 50;
            background: rgba(0,0,0,.6); color: #fff;
            padding: 10px 18px; border-radius: 30px;
            font-size: 13px; font-weight: 500;
            max-width: 90%; text-align: center;
            backdrop-filter: blur(4px); pointer-events: none;
            white-space: nowrap;
        }

        /* ===== ERROR BANNER ===== */
        #error-banner {
            position: fixed; top: 0; left: 0; right: 0; z-index: 200;
            background: #dc2626; color: #fff; text-align: center;
            padding: 14px 16px; font-size: 13px; font-weight: 600;
            display: none; box-shadow: 0 4px 14px rgba(0,0,0,.3);
        }
        #error-banner .btn-retry {
            margin-left: 10px; background: #fff; color: #dc2626;
            border: none; padding: 6px 14px; border-radius: 20px;
            font-size: 12px; font-weight: 800; cursor: pointer;
        }
        #error-banner .btn-retry:active { transform: scale(.95); }

        /* ===== POPUP / DETAIL ===== */
        #popup-backdrop {
            position: fixed; inset: 0; z-index: 90;
            background: rgba(0,0,0,.45); backdrop-filter: blur(2px);
        }
        #popup-wrap {
            position: fixed; inset: 0; z-index: 91;
            display: flex; align-items: flex-end; justify-content: center;
        }
        #popup {
            width: 100%; max-width: 28rem; max-height: 72vh;
            background: #fff; border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,.25);
            display: flex; flex-direction: column;
            animation: slideUp .3s ease;
            overflow: hidden;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .popup-header {
            display: flex; align-items: flex-start; justify-content: space-between;
            gap: 12px; padding: 18px 20px;
            border-bottom: 1px solid #e2e8f0;
        }
        .popup-header h3 { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
        .popup-header p { font-size: 13px; color: #64748b; line-height: 1.5; }
        .btn-close {
            flex-shrink: 0; width: 34px; height: 34px;
            border: none; border-radius: 50%;
            background: #f1f5f9; color: #475569; font-size: 15px; cursor: pointer;
        }
        .popup-body { padding: 16px 20px; overflow-y: auto; }
        .popup-body p { font-size: 14px; line-height: 1.7; color: #334155; }
        .popup-footer {
            display: flex; gap: 8px; padding: 14px 20px 18px;
            border-top: 1px solid #e2e8f0;
        }
        .btn-audio {
            flex: 1; background: #2563eb; color: #fff; border: none;
            padding: 12px 16px; border-radius: 14px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            transition: transform .1s;
        }
        .btn-audio:active { transform: scale(.97); }
        .btn-audio.secondary { background: #e2e8f0; color: #334155; }
        .btn-stop {
            width: 46px; border: none; border-radius: 14px;
            background: #e2e8f0; color: #334155; font-size: 15px; cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- CONTAINER AR -->
    <div id="app">

        <a-scene
            id="ar-scene"
            mindar-image="imageTargetSrc: /markers/targets.mind; uiLoading:no; uiError:no; uiScanning:no; autoStart:false; filterMinCF:0.0001; filterBeta:0.001;"
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <!-- targetIndex & model diisi otomatis dari ?method= (cek script).
                 Model dimuat lazy setelah marker terdeteksi (setAttribute gltf-model). -->
            <a-entity id="target-entity" mindar-image-target="targetIndex: 1">
                <a-entity
                    id="model-entity"
                    position="0 0 0"
                    scale="0.5 0.5 0.5"></a-entity>
            </a-entity>
        </a-scene>

    </div>

    <!-- START SCREEN -->
    <div id="start-screen">
        <div class="icon">📷</div>
        <h1>Siap Scan Marker AR?</h1>
        <p>Pastikan ruangan terang & internet lancar.<br>
        Gunakan browser <b>Chrome</b> atau <b>Safari</b>.</p>
        <button class="btn-start" onclick="startAR()">Mulai Kamera</button>
    </div>

    <!-- UI OVERLAY -->
    <div id="ui-top">
        <a class="btn-back" href="/home/mulai-belajar">⬅ Kembali</a>
        <div class="title-pill" id="method-title">Metode Agile</div>
    </div>
    <div id="status-pill">Memuat AR...</div>

    <!-- ERROR BANNER -->
    <div id="error-banner">
        <span id="error-msg"></span>
        <button class="btn-retry" onclick="location.reload()">Coba Lagi</button>
    </div>

    <!-- POPUP DETAIL -->
    <div id="popup-backdrop" class="hidden" onclick="closePopup()"></div>
    <div id="popup-wrap" class="hidden">
        <div id="popup">
            <div class="popup-header">
                <div>
                    <h3 id="popup-title"></h3>
                    <p id="popup-desc"></p>
                </div>
                <button class="btn-close" onclick="closePopup()">✕</button>
            </div>
            <div class="popup-body"><p id="popup-content"></p></div>
            <div class="popup-footer">
                <button class="btn-audio" id="btn-audio" onclick="toggleAudio()">▶ Dengarkan</button>
                <button class="btn-stop hidden" id="btn-stop" onclick="stopAudio()">■</button>
            </div>
        </div>
    </div>

    <script>
        // ================= KONFIGURASI METODE =================
        // targetIndex & model diambil dari sini. Cek sesuai database (sdlcMethods).
        const METHOD_CONFIG = {
            waterfall: { targetIndex: 0, modelPath: "/models/waterfall.glb", name: "Waterfall" },
            agile:     { targetIndex: 1, modelPath: "/models/agile.glb",     name: "Agile" },
            rad:       { targetIndex: 2, modelPath: "/models/rad.glb",       name: "RAD" },
        };

        const urlParams = new URLSearchParams(window.location.search);
        const methodSlug = urlParams.get("method") || "agile";
        const methodCfg = METHOD_CONFIG[methodSlug] || METHOD_CONFIG.agile;

        document.getElementById("target-entity").setAttribute("mindar-image-target", "targetIndex: " + methodCfg.targetIndex);
        document.title = "AR SDLC - " + methodCfg.name;
        document.getElementById("method-title").textContent = "Metode " + methodCfg.name;

        // ================= DATA TAHAPAN =================
        // Data fallback (biar tetap jalan walau API offline).
        // Data dari /api/steps (database) akan menimpa data ini.
        const FALLBACK_STEPS = {
            waterfall: {
                WF_REQUIREMENTS: { meshName: "WF_REQUIREMENTS", title: "Requirements", description: "Tahap pengumpulan dan analisis kebutuhan sistem.", content: "Pada tahap Requirements, tim pengembang bekerja sama dengan stakeholder untuk mengidentifikasi dan mendokumentasikan semua kebutuhan sistem." },
                WF_DESIGN: { meshName: "WF_DESIGN", title: "Design", description: "Tahap perancangan sistem berdasarkan persyaratan yang telah dikumpulkan.", content: "Tahap Design mengubah kebutuhan yang telah terkumpul menjadi rancangan sistem. Tim merancang arsitektur sistem, struktur database, antarmuka pengguna (UI/UX), dan komponen perangkat lunak." },
                WF_IMPLEMENTATION: { meshName: "WF_IMPLEMENTATION", title: "Implementation", description: "Tahap implementasi kode program berdasarkan desain yang telah dibuat.", content: "Pada tahap Implementation, para developer mulai menulis kode program sesuai dengan spesifikasi dan desain yang telah ditetapkan." },
                WF_TESTING: { meshName: "WF_TESTING", title: "Testing", description: "Tahap pengujian untuk memastikan sistem berfungsi sesuai persyaratan.", content: "Tahap Testing bertujuan untuk memverifikasi dan memvalidasi bahwa sistem yang telah dikembangkan memenuhi semua persyaratan yang telah ditetapkan." },
                WF_DEPLOYMENT: { meshName: "WF_DEPLOYMENT", title: "Deployment", description: "Tahap penyebaran sistem ke lingkungan produksi.", content: "Tahap Deployment meliputi proses instalasi dan penyebaran sistem ke lingkungan produksi yang sebenarnya." },
                WF_MAINTENANCE: { meshName: "WF_MAINTENANCE", title: "Maintenance", description: "Tahap pemeliharaan sistem setelah deployment.", content: "Tahap Maintenance adalah fase terakhir yang berlangsung terus-menerus setelah sistem di-deploy. Kegiatan meliputi perbaikan bug dan penambahan fitur baru." },
            },
            agile: {
                AG_REQUIREMENT: {
                    meshName: "AG_REQUIREMENT",
                    title: "Requirement",
                    description: "Tahap pengumpulan dan analisis kebutuhan pengguna.",
                    content: "Pada tahap Requirement, tim bekerja sama dengan Product Owner dan stakeholder untuk mengumpulkan serta memprioritaskan kebutuhan pengguna. Hasil dari tahap ini adalah Product Backlog yang berisi daftar kebutuhan (user stories) yang akan dikerjakan dalam sprint-sprint mendatang."
                },
                AG_DESIGN: {
                    meshName: "AG_DESIGN",
                    title: "Design",
                    description: "Tahap perancangan solusi berdasarkan kebutuhan yang telah ditentukan.",
                    content: "Tahap Design berfokus pada perancangan arsitektur dan desain teknis untuk setiap user story yang akan dikerjakan. Tim mendiskusikan pendekatan teknis, membuat sketsa antarmuka, dan menentukan struktur data yang sesuai."
                },
                AG_DEVELOPMENT: {
                    meshName: "AG_DEVELOPMENT",
                    title: "Development",
                    description: "Tahap implementasi kode program sesuai dengan desain yang telah disepakati.",
                    content: "Pada tahap Development, para developer mulai menulis kode program untuk setiap user story yang telah didesain. Pengembangan dilakukan secara iteratif dengan siklus sprint yang pendek (biasanya 1-4 minggu)."
                },
                AG_TESTING: {
                    meshName: "AG_TESTING",
                    title: "Testing",
                    description: "Tahap pengujian untuk memastikan kualitas perangkat lunak.",
                    content: "Tahap Testing meliputi berbagai jenis pengujian seperti unit testing, integration testing, dan acceptance testing. Tim QA bekerja sama dengan developer untuk memastikan setiap fitur berfungsi sesuai kriteria penerimaan."
                },
                AG_DEPLOYMENT: {
                    meshName: "AG_DEPLOYMENT",
                    title: "Deployment",
                    description: "Tahap penyebaran fitur ke lingkungan produksi.",
                    content: "Tahap Deployment meliputi proses rilis fitur-fitur yang telah selesai diuji ke lingkungan produksi. Tim menggunakan praktik CI/CD untuk mengotomatiskan proses build, pengujian, dan deployment."
                },
                AG_REVIEW: {
                    meshName: "AG_REVIEW",
                    title: "Review",
                    description: "Tahap evaluasi hasil kerja dan feedback dari stakeholder.",
                    content: "Sprint Review diadakan di akhir sprint untuk mendemonstrasikan hasil kerja yang telah selesai kepada stakeholder. Tim menunjukkan fitur-fitur baru yang telah berfungsi dan menerima feedback langsung."
                }
            },
            rad: {
                RAD_REQUIREMENT: { meshName: "RAD_REQUIREMENT", title: "Requirement Planning", description: "Tahap identifikasi kebutuhan proyek secara awal.", content: "Requirement Planning dalam RAD adalah tahap awal di mana stakeholder dan pengembang melakukan brainstorming untuk mengidentifikasi kebutuhan proyek." },
                RAD_DESIGN: { meshName: "RAD_DESIGN", title: "User Design", description: "Tahap desain prototipe interaktif dengan feedback pengguna.", content: "User Design adalah tahap kunci dalam RAD di mana pengembang dan pengguna akhir bekerja sama secara intensif untuk mendesain prototipe." },
                RAD_CONSTRUCTION: { meshName: "RAD_CONSTRUCTION", title: "Construction", description: "Tahap pembangunan sistem final dengan tools otomatisasi.", content: "Construction adalah tahap di mana prototipe yang telah divalidasi dikembangkan menjadi sistem production-ready." },
                RAD_CUTOVER: { meshName: "RAD_CUTOVER", title: "Cutover", description: "Tahap penyebaran sistem ke lingkungan produksi.", content: "Cutover adalah tahap akhir di mana sistem yang telah selesai dibangun dan diuji disebarkan ke lingkungan produksi." },
            }
        };

        let stepsData = { ...(FALLBACK_STEPS[methodSlug] || {}) };
        let currentStep = null;
        let isTracking = false;
        let modelLoaded = false;

        // ================= AMBIL DATA DARI DATABASE =================
        async function loadSteps() {
            try {
                const res = await fetch("/api/steps");
                if (!res.ok) return;
                const list = await res.json();
                list.forEach((s) => {
                    if (FALLBACK_STEPS[methodSlug] && FALLBACK_STEPS[methodSlug][s.meshName]) {
                        stepsData[s.meshName] = s;
                    }
                });
            } catch (e) {
                console.warn("Gagal ambil data dari API, pakai data fallback.");
            }
        }

        // ================= START AR =================
        function startAR() {
            const sceneEl = document.getElementById("ar-scene");
            const arSystem = sceneEl.systems["mindar-image-system"];
            document.getElementById("start-screen").classList.add("hidden");
            arSystem.start();
        }

        // ================= STATUS =================
        let modelLoading = false;

        function setStatus(text) {
            document.getElementById("status-pill").textContent = text;
        }

        function showError(text) {
            document.getElementById("error-msg").textContent = text;
            document.getElementById("error-banner").style.display = "block";
        }

        function hideError() {
            document.getElementById("error-banner").style.display = "none";
        }

        // ================= CLICK / RAYCASTER =================
        function getActiveCamera() {
            const sceneEl = document.getElementById("ar-scene");
            const camEl = sceneEl.querySelector("a-camera");
            if (camEl && camEl.components.camera && camEl.components.camera.camera) {
                return camEl.components.camera.camera;
            }
            if (sceneEl.camera) return sceneEl.camera;
            return null;
        }

        function handleClick(clientX, clientY) {
            if (!isTracking || !modelLoaded) return;

            const sceneEl = document.getElementById("ar-scene");
            const modelEl = document.getElementById("model-entity");
            const canvas = sceneEl.canvas || (sceneEl.renderer && sceneEl.renderer.domElement);
            if (!canvas || !modelEl || !modelEl.object3D) return;

            const camera = getActiveCamera();
            if (!camera) return;

            const rect = canvas.getBoundingClientRect();
            const x = ((clientX - rect.left) / rect.width) * 2 - 1;
            const y = -((clientY - rect.top) / rect.height) * 2 + 1;

            const raycaster = new AFRAME.THREE.Raycaster();
            raycaster.setFromCamera(new AFRAME.THREE.Vector2(x, y), camera);

            const meshes = [];
            modelEl.object3D.traverse((child) => {
                if (child.isMesh) meshes.push(child);
            });

            const intersects = raycaster.intersectObjects(meshes, false);
            if (intersects.length === 0) return;

            let mesh = intersects[0].object;
            let meshName = mesh.name;
            while (!meshName && mesh.parent) {
                mesh = mesh.parent;
                meshName = mesh.name;
            }

            if (meshName && stepsData[meshName]) {
                openPopup(stepsData[meshName]);
            }
        }

        // ================= GESTURE (tap, putar, zoom) =================
        let touchStartX = 0, touchStartY = 0, lastX = 0, lastY = 0;
        let isDragging = false;
        let pinchStartDist = 0;
        let pinchBaseScale = 1;

        function getDist(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function setupGestures() {
            const sceneEl = document.getElementById("ar-scene");
            const canvas = sceneEl.canvas || (sceneEl.renderer && sceneEl.renderer.domElement);
            if (!canvas) return;
            canvas.style.touchAction = "none";

            canvas.addEventListener("touchstart", (e) => {
                if (e.touches.length === 1) {
                    touchStartX = lastX = e.touches[0].clientX;
                    touchStartY = lastY = e.touches[0].clientY;
                    isDragging = false;
                } else if (e.touches.length === 2) {
                    pinchStartDist = getDist(e.touches);
                    pinchBaseScale = modelEntityScale();
                }
            }, { passive: true });

            canvas.addEventListener("touchmove", (e) => {
                if (e.touches.length === 1) {
                    const dx = e.touches[0].clientX - lastX;
                    const dy = e.touches[0].clientY - lastY;
                    if (Math.abs(e.touches[0].clientX - touchStartX) > 10 ||
                        Math.abs(e.touches[0].clientY - touchStartY) > 10) {
                        isDragging = true;
                    }
                    if (isDragging && modelLoaded) {
                        const model = document.getElementById("model-entity");
                        if (model && model.object3D) {
                            model.object3D.rotation.y += dx * 0.01;
                            model.object3D.rotation.x = Math.max(-Math.PI / 2,
                                Math.min(Math.PI / 2, model.object3D.rotation.x + dy * 0.01));
                        }
                    }
                    lastX = e.touches[0].clientX;
                    lastY = e.touches[0].clientY;
                } else if (e.touches.length === 2 && pinchStartDist) {
                    const dist = getDist(e.touches);
                    const model = document.getElementById("model-entity");
                    if (model && model.object3D) {
                        const s = clamp(pinchBaseScale * (dist / pinchStartDist), 0.3, 3);
                        model.object3D.scale.set(s, s, s);
                    }
                }
            }, { passive: true });

            canvas.addEventListener("touchend", (e) => {
                if (e.touches.length === 0) {
                    if (!isDragging && e.changedTouches[0]) {
                        handleClick(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                    }
                    isDragging = false;
                    pinchStartDist = 0;
                } else if (e.touches.length === 1) {
                    pinchStartDist = 0;
                    pinchBaseScale = modelEntityScale();
                }
            }, { passive: true });

            canvas.addEventListener("click", (e) => {
                handleClick(e.clientX, e.clientY);
            });
        }

        function modelEntityScale() {
            const model = document.getElementById("model-entity");
            return model && model.object3D ? model.object3D.scale.x : 1;
        }

        function clamp(v, min, max) {
            return Math.min(Math.max(v, min), max);
        }

        // ================= POPUP =================
        function openPopup(step) {
            currentStep = step;
            stopAudio();
            document.getElementById("popup-title").textContent = step.title;
            document.getElementById("popup-desc").textContent = step.description || "";
            document.getElementById("popup-content").textContent =
                step.content || "Tidak ada konten detail untuk tahap ini.";
            document.getElementById("popup-backdrop").classList.remove("hidden");
            document.getElementById("popup-wrap").classList.remove("hidden");
        }

        function closePopup() {
            stopAudio();
            currentStep = null;
            document.getElementById("popup-backdrop").classList.add("hidden");
            document.getElementById("popup-wrap").classList.add("hidden");
        }

        // ================= AUDIO / TTS =================
        let utterance = null;

        function getIndonesianVoice() {
            const voices = window.speechSynthesis.getVoices();
            return voices.find((v) => v.lang.startsWith("id")) ||
                voices.find((v) => v.lang.startsWith("ms")) || null;
        }

        function toggleAudio() {
            const btn = document.getElementById("btn-audio");
            const stopBtn = document.getElementById("btn-stop");

            if (utterance && window.speechSynthesis.speaking) {
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                    btn.textContent = "⏸ Jeda";
                } else {
                    window.speechSynthesis.pause();
                    btn.textContent = "▶ Lanjutkan";
                }
                return;
            }

            if (!currentStep) return;
            const text = [currentStep.title, currentStep.description, currentStep.content]
                .filter(Boolean).join(". ");

            window.speechSynthesis.cancel();
            utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "id-ID";
            utterance.rate = 0.9;
            const voice = getIndonesianVoice();
            if (voice) utterance.voice = voice;
            utterance.onend = () => {
                btn.textContent = "▶ Dengarkan";
                stopBtn.classList.add("hidden");
            };
            utterance.onerror = () => {
                btn.textContent = "▶ Dengarkan";
                stopBtn.classList.add("hidden");
            };
            window.speechSynthesis.speak(utterance);
            btn.textContent = "⏸ Jeda";
            stopBtn.classList.remove("hidden");
        }

        function stopAudio() {
            if ("speechSynthesis" in window) window.speechSynthesis.cancel();
            utterance = null;
            document.getElementById("btn-audio").textContent = "▶ Dengarkan";
            document.getElementById("btn-stop").classList.add("hidden");
        }

        // ================= INIT =================
        function init() {
            loadSteps();

            const sceneEl = document.getElementById("ar-scene");
            const targetEl = document.getElementById("target-entity");
            const modelEl = document.getElementById("model-entity");

            sceneEl.addEventListener("arError", () => {
                showError("Gagal mengakses kamera. Aktifkan izin kamera di browser, lalu coba lagi.");
                setStatus("Kamera tidak bisa diakses");
            });

            targetEl.addEventListener("targetFound", () => {
                isTracking = true;
                hideError();
                if (!modelLoaded && !modelLoading) {
                    modelLoading = true;
                    setStatus("Memuat model 3D...");
                    const model = document.getElementById("model-entity");
                    model.setAttribute("gltf-model", methodCfg.modelPath);
                } else if (modelLoaded) {
                    setStatus("Ketuk bagian model untuk melihat penjelasan");
                }
            });

            targetEl.addEventListener("targetLost", () => {
                isTracking = false;
                closePopup();
                setStatus("Arahkan kamera ke marker AR");
            });

            modelEl.addEventListener("model-loaded", () => {
                modelLoaded = true;
                if (isTracking) setStatus("Ketuk bagian model untuk melihat penjelasan");
            });

            modelEl.addEventListener("model-error", () => {
                showError("Gagal memuat model 3D. Cek koneksi internet, lalu coba lagi.");
                setStatus("Model 3D gagal dimuat");
            });

            sceneEl.addEventListener("loaded", () => {
                setStatus("Arahkan kamera ke marker AR");
                setupGestures();
            });
        }

        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => {};
        }
        init();
    </script>
</body>
</html>
