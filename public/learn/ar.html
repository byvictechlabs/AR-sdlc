<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR SDLC - Agile</title>

    <!-- A-Frame + MindAR -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            background: #0b1220;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        #app { position: fixed; inset: 0; }

        a-scene { width: 100%; height: 100%; }

        /* Sembunyikan UI bawaan A-Frame/MindAR */
        .a-orientation-modal,
        .a-scene-warning,
        .a-vr-button,
        .a-loader-title,
        a-scene .a-loader { display: none !important; }

        /* ===== START SCREEN ===== */
        #start-screen {
            position: absolute; inset: 0; z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; color: #fff; padding: 24px;
            background: linear-gradient(160deg, #2563eb, #4f46e5);
        }
        #start-screen .icon { font-size: 44px; margin-bottom: 16px; }
        #start-screen h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
        #start-screen p { font-size: 13px; opacity: .9; line-height: 1.6; max-width: 80%; }
        #start-screen p b { opacity: 1; }
        .btn-start {
            margin-top: 28px; background: #fff; color: #2563eb;
            border: none; padding: 14px 48px; border-radius: 50px;
            font-size: 15px; font-weight: 800; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,.2);
            transition: transform .15s;
        }
        .btn-start:active { transform: scale(.95); }

        /* ===== UI OVERLAY ===== */
        #ui-top {
            position: absolute; top: 0; left: 0; right: 0; z-index: 50;
            display: flex; align-items: center; gap: 10px; padding: 16px;
            pointer-events: none;
        }
        .btn-back {
            pointer-events: auto;
            display: flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,.92); border: none;
            padding: 9px 16px; border-radius: 30px;
            font-size: 13px; font-weight: 700; color: #1e293b; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,.15);
            text-decoration: none;
        }
        .title-pill {
            background: rgba(0,0,0,.55); color: #fff;
            padding: 8px 16px; border-radius: 30px;
            font-size: 13px; font-weight: 600; backdrop-filter: blur(4px);
        }

        #status-pill {
            position: absolute; bottom: 24px; left: 50%;
            transform: translateX(-50%); z-index: 50;
            background: rgba(0,0,0,.6); color: #fff;
            padding: 10px 18px; border-radius: 30px;
            font-size: 13px; font-weight: 500;
            max-width: 90%; text-align: center;
            backdrop-filter: blur(4px); pointer-events: none;
            white-space: nowrap;
        }

        /* ===== ERROR BANNER ===== */
        #error-banner {
            position: fixed; top: 0; left: 0; right: 0; z-index: 200;
            background: #dc2626; color: #fff; text-align: center;
            padding: 14px 16px; font-size: 13px; font-weight: 600;
            display: none; box-shadow: 0 4px 14px rgba(0,0,0,.3);
        }
        #error-banner .btn-retry {
            margin-left: 10px; background: #fff; color: #dc2626;
            border: none; padding: 6px 14px; border-radius: 20px;
            font-size: 12px; font-weight: 800; cursor: pointer;
        }
        #error-banner .btn-retry:active { transform: scale(.95); }

        /* ===== POPUP / DETAIL ===== */
        #popup-backdrop {
            position: fixed; inset: 0; z-index: 90;
            background: rgba(0,0,0,.45); backdrop-filter: blur(2px);
        }
        #popup-wrap {
            position: fixed; inset: 0; z-index: 91;
            display: flex; align-items: flex-end; justify-content: center;
        }
        #popup {
            width: 100%; max-width: 28rem; max-height: 72vh;
            background: #fff; border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,.25);
            display: flex; flex-direction: column;
            animation: slideUp .3s ease;
            overflow: hidden;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .popup-header {
            display: flex; align-items: flex-start; justify-content: space-between;
            gap: 12px; padding: 18px 20px;
            border-bottom: 1px solid #e2e8f0;
        }
        .popup-header h3 { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
        .popup-header p { font-size: 13px; color: #64748b; line-height: 1.5; }
        .btn-close {
            flex-shrink: 0; width: 34px; height: 34px;
            border: none; border-radius: 50%;
            background: #f1f5f9; color: #475569; font-size: 15px; cursor: pointer;
        }
        .popup-body { padding: 16px 20px; overflow-y: auto; }
        .popup-body p { font-size: 14px; line-height: 1.7; color: #334155; }
        .popup-footer {
            display: flex; gap: 8px; padding: 14px 20px 18px;
            border-top: 1px solid #e2e8f0;
        }
        .btn-audio {
            flex: 1; background: #2563eb; color: #fff; border: none;
            padding: 12px 16px; border-radius: 14px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            transition: transform .1s;
        }
        .btn-audio:active { transform: scale(.97); }
        .btn-audio.secondary { background: #e2e8f0; color: #334155; }
        .btn-stop {
            width: 46px; border: none; border-radius: 14px;
            background: #e2e8f0; color: #334155; font-size: 15px; cursor: pointer;
        }

        .hidden { display: none !important; }

        /* ===== MODEL LOADING OVERLAY ===== */
        #model-loading-overlay {
            position: fixed; inset: 0; z-index: 150;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(11, 18, 32, 0.85);
            backdrop-filter: blur(8px);
            color: #fff; text-align: center;
            transition: opacity 0.4s ease;
        }
        #model-loading-overlay.fade-out {
            opacity: 0; pointer-events: none;
        }
        .loading-ring {
            width: 72px; height: 72px;
            border: 4px solid rgba(255,255,255,0.12);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-title {
            font-size: 16px; font-weight: 700;
            margin-top: 20px; letter-spacing: 0.3px;
        }
        .progress-track {
            width: 220px; height: 6px;
            background: rgba(255,255,255,0.12);
            border-radius: 3px; margin-top: 18px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            border-radius: 3px;
            transition: width 0.25s ease;
        }
        .progress-text {
            margin-top: 10px;
            font-size: 12px; font-weight: 500;
            opacity: 0.7;
        }

        /* ===== MESH CLICK FEEDBACK ===== */
        #mesh-feedback {
            position: absolute; bottom: 80px; left: 50%;
            transform: translateX(-50%); z-index: 60;
            padding: 10px 20px; border-radius: 14px;
            font-size: 13px; font-weight: 600;
            backdrop-filter: blur(8px);
            pointer-events: none;
            opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease;
            max-width: 85%; text-align: center;
        }
        #mesh-feedback.show {
            opacity: 1; transform: translateX(-50%) translateY(0);
        }
        #mesh-feedback.success {
            background: rgba(34, 197, 94, 0.9); color: #fff;
        }
        #mesh-feedback.notfound {
            background: rgba(251, 191, 36, 0.9); color: #1e293b;
        }
        #mesh-feedback.nomesh {
            background: rgba(100, 116, 139, 0.85); color: #fff;
        }
    </style>
</head>
<body>

    <!-- CONTAINER AR -->
    <div id="app">

        <a-scene
            id="ar-scene"
            mindar-image="imageTargetSrc: /markers/targets.mind; uiLoading:no; uiError:no; uiScanning:no; autoStart:false; filterMinCF:0.0001; filterBeta:0.001;"
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <!-- targetIndex & model diisi otomatis dari ?method= (cek script).
                 Model dimuat lazy setelah marker terdeteksi (setAttribute gltf-model). -->
            <a-entity id="target-entity" mindar-image-target="targetIndex: 1">
                <a-entity
                    id="model-entity"
                    position="0 0 0"
                    scale="0.2 0.2 0.2"></a-entity>
            </a-entity>
        </a-scene>

    </div>

    <!-- START SCREEN -->
    <div id="start-screen">
        <div class="icon">📷</div>
        <h1>Siap Scan Marker AR?</h1>
        <p>Pastikan ruangan terang & internet lancar.<br>
        Gunakan browser <b>Chrome</b> atau <b>Safari</b>.</p>
        <button class="btn-start" onclick="startAR()">Mulai Kamera</button>
    </div>

    <!-- UI OVERLAY -->
    <div id="ui-top">
        <a class="btn-back" href="/home/mulai-belajar">⬅ Kembali</a>
        <div class="title-pill" id="method-title">Metode Agile</div>
    </div>
    <div id="status-pill">Memuat AR...</div>

    <!-- MESH CLICK FEEDBACK -->
    <div id="mesh-feedback"></div>

    <!-- ERROR BANNER -->
    <div id="error-banner">
        <span id="error-msg"></span>
        <button class="btn-retry" onclick="location.reload()">Coba Lagi</button>
    </div>

    <!-- MODEL LOADING OVERLAY -->
    <div id="model-loading-overlay" class="hidden">
        <div class="loading-ring"></div>
        <div class="loading-title">Memuat Model 3D</div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-text" id="progress-text">Mengunduh...</div>
    </div>

    <!-- POPUP DETAIL -->
    <div id="popup-backdrop" class="hidden" onclick="closePopup()"></div>
    <div id="popup-wrap" class="hidden">
        <div id="popup">
            <div class="popup-header">
                <div>
                    <h3 id="popup-title"></h3>
                    <p id="popup-desc"></p>
                </div>
                <button class="btn-close" onclick="closePopup()">✕</button>
            </div>
            <div class="popup-body"><p id="popup-content"></p></div>
            <div class="popup-footer">
                <button class="btn-audio" id="btn-audio" onclick="toggleAudio()">▶ Dengarkan</button>
                <button class="btn-stop hidden" id="btn-stop" onclick="stopAudio()">■</button>
            </div>
        </div>
    </div>

    <script>
        // ================= URL PARAMS =================
        const urlParams = new URLSearchParams(window.location.search);
        const methodSlug = urlParams.get("method") || "agile";

        // ================= STATE =================
        let methodCfg = { targetIndex: 1, modelPath: "https://models.byvictech.site/models/agile-new.glb", name: methodSlug };
        let stepsData = {};
        let currentStep = null;
        let isTracking = false;
        let modelLoaded = false;
        let modelLoading = false;
        let dataLoaded = false;

        // ================= UI INIT (show something immediately) =================
        document.getElementById("method-title").textContent = "Memuat...";

        // ================= LOAD DATA FROM DATABASE (dynamic-first) =================
        const API_TIMEOUT = 5000;

        async function loadFromDB() {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), API_TIMEOUT);
            try {
                const res = await fetch("/api/methods/by-slug/" + methodSlug, { signal: controller.signal });
                clearTimeout(timer);
                if (!res.ok) throw new Error("API " + res.status);
                const data = await res.json();

                // Update method config dari DB
                methodCfg = {
                    targetIndex: data.mindTargetIndex ?? 1,
                    modelPath: data.modelPath || methodCfg.modelPath,
                    name: data.name || methodSlug,
                };

                // Update UI
                document.getElementById("target-entity").setAttribute("mindar-image-target", "targetIndex: " + methodCfg.targetIndex);
                document.title = "AR SDLC - " + methodCfg.name;
                document.getElementById("method-title").textContent = "Metode " + methodCfg.name;

                // Build stepsData dari DB — langsung pakai tanpa match fallback
                stepsData = {};
                if (data.steps && Array.isArray(data.steps)) {
                    data.steps.forEach(function(s) {
                        if (s.meshName) stepsData[s.meshName] = s;
                    });
                }

                dataLoaded = true;
                console.log("Data loaded from DB:", methodCfg.name, "steps:", Object.keys(stepsData).length);
            } catch (e) {
                clearTimeout(timer);
                console.warn("DB load failed (" + e.message + "), using fallback config");
                // Apply fallback config
                document.getElementById("target-entity").setAttribute("mindar-image-target", "targetIndex: " + methodCfg.targetIndex);
                document.title = "AR SDLC - " + methodCfg.name;
                document.getElementById("method-title").textContent = "Metode " + methodCfg.name;
            }
        }

        // ================= START AR =================
        function startAR() {
            // Kamera wajib HTTPS (kecuali localhost/127.0.0.1).
            // Di HP yang dibuka via http://IP, browser menolak kamera walau sudah diizinkan.
            const host = window.location.hostname;
            const secureOK = window.location.protocol === "https:" ||
                host === "localhost" || host === "127.0.0.1";
            if (!secureOK) {
                showError("Kamera hanya bisa aktif saat halaman dibuka via HTTPS (mis. URL Vercel). Alamat http://IP biasa ditolak browser di HP.");
                return;
            }

            const sceneEl = document.getElementById("ar-scene");

            const begin = () => {
                const arSystem = sceneEl.systems && sceneEl.systems["mindar-image-system"];
                if (!arSystem) {
                    showError("Engine AR belum siap. Periksa koneksi internet lalu muat ulang halaman.");
                    return;
                }
                try {
                    arSystem.start();
                } catch (e) {
                    console.error("MindAR start error:", e);
                    showError("Gagal mulai kamera AR. Tutup lalu buka ulang halaman, dan izinkan lagi akses kameranya.");
                }
            };

            document.getElementById("start-screen").classList.add("hidden");

            // Di HP yang lambat scene bisa belum siap saat tombol ditekan.
            // Tunggu event "loaded" dulu agar arSystem.start() benar-benar berjalan.
            if (sceneEl.hasLoaded) {
                begin();
            } else {
                sceneEl.addEventListener("loaded", begin, { once: true });
            }
        }

        // ================= STATUS =================

        function setStatus(text) {
            document.getElementById("status-pill").textContent = text;
        }

        function showError(text) {
            document.getElementById("error-msg").textContent = text;
            document.getElementById("error-banner").style.display = "block";
        }

        function hideError() {
            document.getElementById("error-banner").style.display = "none";
        }

        // ================= MESH CLICK FEEDBACK =================
        var feedbackTimer = null;

        function showMeshFeedback(text, type) {
            var el = document.getElementById("mesh-feedback");
            el.textContent = text;
            el.className = type + " show";
            clearTimeout(feedbackTimer);
            feedbackTimer = setTimeout(function() {
                el.classList.remove("show");
            }, 2500);
        }

        // ================= MODEL DOWNLOAD WITH PROGRESS + CACHE =================
        const MODEL_CACHE = "ar-models-v1";

        function loadModelWithProgress(url) {
            const overlay = document.getElementById("model-loading-overlay");
            const fill = document.getElementById("progress-fill");
            const text = document.getElementById("progress-text");

            overlay.classList.remove("hidden", "fade-out");
            fill.style.width = "0%";
            text.textContent = "Mengecek cache...";
            setStatus("Memuat model 3D...");

            // Cek Cache API dulu
            if ("caches" in window) {
                caches.open(MODEL_CACHE).then(function(cache) {
                    return cache.match(url);
                }).then(function(cached) {
                    if (cached) {
                        console.log("[Model] Cache hit:", url);
                        fill.style.width = "100%";
                        text.textContent = "Memuat dari cache...";
                        return cached.blob().then(function(blob) {
                            var blobURL = URL.createObjectURL(blob);
                            var model = document.getElementById("model-entity");
                            model.setAttribute("gltf-model", blobURL);
                        });
                    } else {
                        fetchAndCache(url, fill, text, overlay);
                    }
                }).catch(function() {
                    fetchAndCache(url, fill, text, overlay);
                });
            } else {
                fetchAndCache(url, fill, text, overlay);
            }
        }

        function fetchAndCache(url, fill, text, overlay) {
            text.textContent = "Mengunduh...";

            fetch(url)
                .then(function(response) {
                    if (!response.ok) throw new Error("HTTP " + response.status);
                    var contentLength = +(response.headers.get("Content-Length") || 0);
                    var reader = response.body.getReader();
                    var received = 0;
                    var chunks = [];

                    function pump() {
                        return reader.read().then(function(result) {
                            if (result.done) {
                                var blob = new Blob(chunks, {
                                    type: response.headers.get("Content-Type") || "model/gltf-binary"
                                });
                                // Simpan ke Cache API
                                if ("caches" in window) {
                                    var responseToCache = new Response(blob, {
                                        headers: { "Content-Type": "model/gltf-binary" }
                                    });
                                    caches.open(MODEL_CACHE).then(function(cache) {
                                        cache.put(url, responseToCache);
                                        console.log("[Model] Cached:", url);
                                    });
                                }
                                var blobURL = URL.createObjectURL(blob);
                                fill.style.width = "100%";
                                text.textContent = "Memuat model ke kamera...";
                                var model = document.getElementById("model-entity");
                                model.setAttribute("gltf-model", blobURL);
                                return;
                            }
                            chunks.push(result.value);
                            received += result.value.length;

                            if (contentLength > 0) {
                                var pct = Math.round((received / contentLength) * 100);
                                fill.style.width = pct + "%";
                                text.textContent = "Mengunduh... " + pct + "% (" +
                                    (received / 1048576).toFixed(1) + " / " +
                                    (contentLength / 1048576).toFixed(1) + " MB)";
                            } else {
                                text.textContent = "Mengunduh... " +
                                    (received / 1048576).toFixed(1) + " MB";
                            }
                            return pump();
                        });
                    }
                    return pump();
                })
                .catch(function(e) {
                    console.error("Model download failed:", e);
                    overlay.classList.add("hidden");
                    showError("Gagal memuat model 3D. Cek koneksi internet, lalu coba lagi.");
                    setStatus("Model 3D gagal dimuat");
                    modelLoading = false;
                });
        }

        // ================= CLICK / RAYCASTER =================
        function getCameras() {
            const sceneEl = document.getElementById("ar-scene");
            const list = [];
            if (sceneEl && sceneEl.camera) list.push(sceneEl.camera);
            const camEl = sceneEl.querySelector("a-camera");
            if (camEl && camEl.components.camera && camEl.components.camera.camera) {
                list.push(camEl.components.camera.camera);
            }
            return list.filter((c, i) => c && list.indexOf(c) === i);
        }

        // Ambil nama tahap dari objek mesh; nama bisa ada di mesh itu sendiri
        // atau di parent-nya (Group). Sesuai mesh name yang dipakai admin.
        function resolveMeshName(obj) {
            let cur = obj;
            while (cur) {
                if (cur.name && cur.name.trim()) return cur.name.trim();
                cur = cur.parent;
            }
            return null;
        }

        // Cari nama mesh tahap yang menutupi titik klik.
        // Jika raycast gagal, fallback ke tahap terdekat dari proyeksi layar.
        function findStageNameAt(clientX, clientY, camera) {
            const sceneEl = document.getElementById("ar-scene");
            const modelEl = document.getElementById("model-entity");
            const canvas = sceneEl.canvas || (sceneEl.renderer && sceneEl.renderer.domElement);
            if (!camera || !modelEl || !modelEl.object3D) return null;

            const rect = canvas && canvas.getBoundingClientRect
                ? canvas.getBoundingClientRect()
                : { width: window.innerWidth, height: window.innerHeight, left: 0, top: 0 };
            const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
            const ny = -((clientY - rect.top) / rect.height) * 2 + 1;

            camera.updateMatrixWorld(true);
            modelEl.object3D.updateWorldMatrix(true, true);

            const meshes = [];
            modelEl.object3D.traverse((child) => {
                if (child.isMesh) meshes.push(child);
            });
            if (meshes.length === 0) return null;

            const raycaster = new AFRAME.THREE.Raycaster();
            raycaster.setFromCamera(new AFRAME.THREE.Vector2(nx, ny), camera);

            const intersects = raycaster.intersectObjects(meshes, true);
            if (intersects.length > 0) {
                const name = resolveMeshName(intersects[0].object);
                if (name) return name;
            }

            // Fallback: cari mesh yang menutupi titik klik pakai bounding sphere.
            // Lebih akurat dari sekadar center karena memperhitungkan ukuran mesh di layar.
            const worldPos = new AFRAME.THREE.Vector3();
            const box = new AFRAME.THREE.Box3();
            const size = new AFRAME.THREE.Vector3();
            let bestName = null;
            let bestDist = Infinity;
            for (const mesh of meshes) {
                const name = resolveMeshName(mesh);
                if (!name) continue;
                box.setFromObject(mesh);
                box.getSize(size);
                const radius = size.length() * 0.5;
                mesh.getWorldPosition(worldPos);
                const projected = worldPos.project(camera);
                if (projected.z < -1 || projected.z > 1) continue;
                const sx = (projected.x + 1) / 2 * rect.width + rect.left;
                const sy = (-projected.y + 1) / 2 * rect.height + rect.top;
                // Estimasi radius mesh di layar (pixels)
                const screenRadius = Math.max(
                    (box.max.x - box.min.x) * 0.5 * rect.width * 0.5,
                    (box.max.y - box.min.y) * 0.5 * rect.height * 0.5,
                    40
                );
                const d = Math.hypot(sx - clientX, sy - clientY);
                if (d < screenRadius + 30 && d < bestDist) {
                    bestDist = d;
                    bestName = name;
                }
            }
            return bestName;
        }

        function handleClick(clientX, clientY) {
            if (!isTracking || !modelLoaded) return;
            if (currentStep) return;

            for (const camera of getCameras()) {
                const name = findStageNameAt(clientX, clientY, camera);
                if (!name) continue;
                if (stepsData[name]) {
                    showMeshFeedback("✓ " + stepsData[name].title, "success");
                    openPopup(stepsData[name]);
                    return;
                }
                // Mesh ketemu tapi ga ada di data admin
                console.warn("Mesh ditemukan tapi tidak ada di data admin:", name);
                showMeshFeedback("⚠ Mesh \"" + name + "\" belum ada penjelasan", "notfound");
                return;
            }
            showMeshFeedback("Tidak ada bagian model yang terdeteksi", "nomesh");
        }

        // ================= GESTURE (tap, putar, zoom) =================
        // Pointer events dipakai jika tersedia; jika tidak, fallback ke touch & mouse.
        // Seleksi tahap dilakukan lewat event "click" (bukan touchend/pointerup)
        // agar popup tidak langsung tertutup oleh click palsu dari browser.
        const gesture = {
            pointers: new Map(),
            startX: 0, startY: 0,
            lastX: 0, lastY: 0,
            dragging: false,
            pinching: false,
            pinchStartDist: 0,
            pinchBaseScale: 1,
        };
        let pendingTap = false;

        function pointDist(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        function getGesturePoints() {
            return Array.from(gesture.pointers.values());
        }

        function gestureDown(id, x, y) {
            const pts = gesture.pointers;
            if (pts.size >= 2 || pts.has(id)) return;
            pts.set(id, { x, y });
            if (pts.size === 1) {
                gesture.startX = gesture.lastX = x;
                gesture.startY = gesture.lastY = y;
                gesture.dragging = false;
                gesture.pinching = false;
            } else if (pts.size === 2) {
                gesture.pinching = true;
                const arr = getGesturePoints();
                gesture.pinchStartDist = pointDist(arr[0], arr[1]);
                gesture.pinchBaseScale = modelEntityScale();
            }
        }

        function gestureMove(id, x, y) {
            const pts = gesture.pointers;
            if (!pts.has(id)) return;
            pts.set(id, { x, y });
            if (pts.size === 1) {
                const dx = x - gesture.lastX;
                const dy = y - gesture.lastY;
                if (Math.abs(x - gesture.startX) > 15 ||
                    Math.abs(y - gesture.startY) > 15) {
                    gesture.dragging = true;
                }
                if (gesture.dragging && modelLoaded) rotateModel(dx, dy);
                gesture.lastX = x;
                gesture.lastY = y;
            } else if (pts.size === 2 && gesture.pinchStartDist) {
                const arr = getGesturePoints();
                const d = pointDist(arr[0], arr[1]);
                const model = document.getElementById("model-entity");
                if (model && model.object3D) {
                    const s = clamp(gesture.pinchBaseScale * (d / gesture.pinchStartDist), 0.08, 3);
                    model.object3D.scale.set(s, s, s);
                }
            }
        }

        function gestureUp(id, x, y) {
            const pts = gesture.pointers;
            if (!pts.has(id)) return;
            pts.delete(id);
            if (pts.size === 0) {
                pendingTap = !gesture.dragging && !gesture.pinching;
                gesture.dragging = false;
                gesture.pinching = false;
                gesture.pinchStartDist = 0;
            } else if (pts.size === 1) {
                gesture.pinchStartDist = 0;
                gesture.pinching = false;
                const remaining = getGesturePoints()[0];
                gesture.startX = gesture.lastX = remaining.x;
                gesture.startY = gesture.lastY = remaining.y;
                gesture.dragging = false;
            }
        }

        function clearGesture() {
            gesture.pointers.clear();
            gesture.dragging = false;
            gesture.pinching = false;
            gesture.pinchStartDist = 0;
        }

        function rotateModel(dx, dy) {
            if (!modelLoaded) return;
            const model = document.getElementById("model-entity");
            if (!model || !model.object3D) return;
            model.object3D.rotation.y += dx * 0.025;
            model.object3D.rotation.x = clamp(
                model.object3D.rotation.x + dy * 0.025,
                -1.6, 1.6
            );
        }

        function modelEntityScale() {
            const model = document.getElementById("model-entity");
            return model && model.object3D ? model.object3D.scale.x : 1;
        }

        function clamp(v, min, max) {
            return Math.min(Math.max(v, min), max);
        }

        function setupGestures() {
            const sceneEl = document.getElementById("ar-scene");
            if (!sceneEl) return;
            // Dengar event di elemen <a-scene>, bukan objek canvas.
            // Elemen scene selalu ada, jadi event tetap tertangkap walau canvas
            // dibuat ulang oleh A-Frame/MindAR.
            sceneEl.style.touchAction = "none";

            if (window.PointerEvent) {
                sceneEl.addEventListener("pointerdown", (e) => {
                    if (e.button !== undefined && e.button !== 0 && e.pointerType === "mouse") return;
                    gestureDown(e.pointerId, e.clientX, e.clientY);
                });
                sceneEl.addEventListener("pointermove", (e) => {
                    gestureMove(e.pointerId, e.clientX, e.clientY);
                });
                sceneEl.addEventListener("pointerup", (e) => {
                    gestureUp(e.pointerId, e.clientX, e.clientY);
                });
                sceneEl.addEventListener("pointercancel", clearGesture);
            } else {
                sceneEl.addEventListener("touchstart", (e) => {
                    for (const t of e.touches) gestureDown(t.identifier, t.clientX, t.clientY);
                }, { passive: true });
                sceneEl.addEventListener("touchmove", (e) => {
                    for (const t of e.changedTouches) gestureMove(t.identifier, t.clientX, t.clientY);
                }, { passive: true });
                sceneEl.addEventListener("touchend", (e) => {
                    for (const t of e.changedTouches) gestureUp(t.identifier, t.clientX, t.clientY);
                }, { passive: true });
                sceneEl.addEventListener("touchcancel", clearGesture, { passive: true });

                sceneEl.addEventListener("mousedown", (e) => {
                    if (e.button === 0) gestureDown(0, e.clientX, e.clientY);
                });
                window.addEventListener("mousemove", (e) => {
                    gestureMove(0, e.clientX, e.clientY);
                });
                window.addEventListener("mouseup", (e) => {
                    gestureUp(0, e.clientX, e.clientY);
                });
            }

            // Seleksi tahap lewat event click (sudah pasti tap, bukan drag)
            sceneEl.addEventListener("click", (e) => {
                if (!pendingTap) return;
                pendingTap = false;
                handleClick(e.clientX, e.clientY);
            });

            // Cegah konteks menu kanan saat tap & tahan
            sceneEl.addEventListener("contextmenu", (e) => e.preventDefault());
        }

        // ================= POPUP =================
        function openPopup(step) {
            currentStep = step;
            stopAudio();
            document.getElementById("popup-title").textContent = step.title;
            document.getElementById("popup-desc").textContent = step.description || "";
            document.getElementById("popup-content").textContent =
                step.content || "Tidak ada konten detail untuk tahap ini.";
            document.getElementById("popup-backdrop").classList.remove("hidden");
            document.getElementById("popup-wrap").classList.remove("hidden");
        }

        function closePopup() {
            stopAudio();
            currentStep = null;
            document.getElementById("popup-backdrop").classList.add("hidden");
            document.getElementById("popup-wrap").classList.add("hidden");
        }

        // ================= AUDIO / TTS =================
        let utterance = null;

        function getIndonesianVoice() {
            const voices = window.speechSynthesis.getVoices();
            return voices.find((v) => v.lang.startsWith("id")) ||
                voices.find((v) => v.lang.startsWith("ms")) || null;
        }

        function toggleAudio() {
            const btn = document.getElementById("btn-audio");
            const stopBtn = document.getElementById("btn-stop");

            if (utterance && window.speechSynthesis.speaking) {
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                    btn.textContent = "⏸ Jeda";
                } else {
                    window.speechSynthesis.pause();
                    btn.textContent = "▶ Lanjutkan";
                }
                return;
            }

            if (!currentStep) return;
            const text = [currentStep.title, currentStep.description, currentStep.content]
                .filter(Boolean).join(". ");

            window.speechSynthesis.cancel();
            utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "id-ID";
            utterance.rate = 0.9;
            const voice = getIndonesianVoice();
            if (voice) utterance.voice = voice;
            utterance.onend = () => {
                btn.textContent = "▶ Dengarkan";
                stopBtn.classList.add("hidden");
            };
            utterance.onerror = () => {
                btn.textContent = "▶ Dengarkan";
                stopBtn.classList.add("hidden");
            };
            window.speechSynthesis.speak(utterance);
            btn.textContent = "⏸ Jeda";
            stopBtn.classList.remove("hidden");
        }

        function stopAudio() {
            if ("speechSynthesis" in window) window.speechSynthesis.cancel();
            utterance = null;
            document.getElementById("btn-audio").textContent = "▶ Dengarkan";
            document.getElementById("btn-stop").classList.add("hidden");
        }

        // ================= INIT =================
        async function init() {
            await loadFromDB();

            const sceneEl = document.getElementById("ar-scene");
            const targetEl = document.getElementById("target-entity");
            const modelEl = document.getElementById("model-entity");

            sceneEl.addEventListener("arError", () => {
                showError("Gagal mengakses kamera. Aktifkan izin kamera di browser, lalu coba lagi.");
                setStatus("Kamera tidak bisa diakses");
            });

            sceneEl.addEventListener("arReady", () => {
                setStatus("Arahkan kamera ke marker AR");
            });

            targetEl.addEventListener("targetFound", () => {
                isTracking = true;
                hideError();
                if (!modelLoaded && !modelLoading) {
                    modelLoading = true;
                    loadModelWithProgress(methodCfg.modelPath);
                } else if (modelLoaded) {
                    setStatus("Ketuk bagian model untuk melihat penjelasan");
                }
            });

            targetEl.addEventListener("targetLost", () => {
                isTracking = false;
                closePopup();
                setStatus("Arahkan kamera ke marker AR");
            });

            modelEl.addEventListener("model-loaded", () => {
                modelLoaded = true;
                const overlay = document.getElementById("model-loading-overlay");
                overlay.classList.add("fade-out");
                setTimeout(() => overlay.classList.add("hidden"), 400);
                if (modelEl.object3D) modelEl.object3D.rotation.order = "YXZ";
                if (isTracking) setStatus("Ketuk bagian model untuk melihat penjelasan");
            });

            modelEl.addEventListener("model-error", () => {
                var overlay = document.getElementById("model-loading-overlay");
                overlay.classList.add("hidden");
                showError("Gagal memuat model 3D. Cek koneksi internet, lalu coba lagi.");
                setStatus("Model 3D gagal dimuat");
                modelLoading = false;
            });

            sceneEl.addEventListener("loaded", () => {
                setStatus("Arahkan kamera ke marker AR");
                setupGestures();
            });
        }

        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => {};
        }
        init();
    </script>
</body>
</html>
