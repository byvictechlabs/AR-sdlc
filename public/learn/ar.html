<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR SDLC</title>

    <!-- A-Frame + MindAR -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            background: #0b1220;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        #app { position: fixed; inset: 0; }

        a-scene { width: 100%; height: 100%; }

        /* Sembunyikan UI bawaan A-Frame/MindAR */
        .a-orientation-modal,
        .a-scene-warning,
        .a-vr-button,
        .a-loader-title,
        a-scene .a-loader { display: none !important; }

        /* ===== START SCREEN ===== */
        #start-screen {
            position: absolute; inset: 0; z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; color: #fff; padding: 24px;
            background: linear-gradient(160deg, #2563eb, #4f46e5);
        }
        #start-screen .icon { font-size: 44px; margin-bottom: 16px; }
        #start-screen h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
        #start-screen p { font-size: 13px; opacity: .9; line-height: 1.6; max-width: 80%; }
        #start-screen p b { opacity: 1; }
        .btn-start {
            margin-top: 28px; background: #fff; color: #2563eb;
            border: none; padding: 14px 48px; border-radius: 50px;
            font-size: 15px; font-weight: 800; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,.2);
            transition: transform .15s;
        }
        .btn-start:active { transform: scale(.95); }

        /* ===== UI OVERLAY ===== */
        #ui-top {
            position: absolute; top: 0; left: 0; right: 0; z-index: 50;
            display: flex; align-items: center; gap: 10px; padding: 16px;
            pointer-events: none;
        }
        .btn-back {
            pointer-events: auto;
            display: flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,.92); border: none;
            padding: 9px 16px; border-radius: 30px;
            font-size: 13px; font-weight: 700; color: #1e293b; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,.15);
            text-decoration: none;
        }
        .title-pill {
            background: rgba(0,0,0,.55); color: #fff;
            padding: 8px 16px; border-radius: 30px;
            font-size: 13px; font-weight: 600; backdrop-filter: blur(4px);
        }

        #status-pill {
            position: absolute; bottom: 24px; left: 50%;
            transform: translateX(-50%); z-index: 50;
            background: rgba(0,0,0,.6); color: #fff;
            padding: 10px 18px; border-radius: 30px;
            font-size: 13px; font-weight: 500;
            max-width: 90%; text-align: center;
            backdrop-filter: blur(4px); pointer-events: none;
            white-space: nowrap;
        }

        /* ===== ERROR BANNER ===== */
        #error-banner {
            position: fixed; top: 0; left: 0; right: 0; z-index: 200;
            background: #dc2626; color: #fff; text-align: center;
            padding: 14px 16px; font-size: 13px; font-weight: 600;
            display: none; box-shadow: 0 4px 14px rgba(0,0,0,.3);
        }
        #error-banner .btn-retry {
            margin-left: 10px; background: #fff; color: #dc2626;
            border: none; padding: 6px 14px; border-radius: 20px;
            font-size: 12px; font-weight: 800; cursor: pointer;
        }
        #error-banner .btn-retry:active { transform: scale(.95); }

        /* ===== POPUP / DETAIL ===== */
        #popup-backdrop {
            position: fixed; inset: 0; z-index: 90;
            background: rgba(0,0,0,.45); backdrop-filter: blur(2px);
        }
        #popup-wrap {
            position: fixed; inset: 0; z-index: 91;
            display: flex; align-items: flex-end; justify-content: center;
        }
        #popup {
            width: 100%; max-width: 28rem; max-height: 72vh;
            background: #fff; border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,.25);
            display: flex; flex-direction: column;
            animation: slideUp .3s ease;
            overflow: hidden;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .popup-header {
            display: flex; align-items: flex-start; justify-content: space-between;
            gap: 12px; padding: 18px 20px;
            border-bottom: 1px solid #e2e8f0;
        }
        .popup-header h3 { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
        .popup-header p { font-size: 13px; color: #64748b; line-height: 1.5; }
        .btn-close {
            flex-shrink: 0; width: 34px; height: 34px;
            border: none; border-radius: 50%;
            background: #f1f5f9; color: #475569; font-size: 15px; cursor: pointer;
        }
        .popup-body { padding: 16px 20px; overflow-y: auto; }
        .popup-body p { font-size: 14px; line-height: 1.7; color: #334155; }
        .popup-footer {
            display: flex; gap: 8px; padding: 14px 20px 18px;
            border-top: 1px solid #e2e8f0;
        }
        .btn-audio {
            flex: 1; background: #2563eb; color: #fff; border: none;
            padding: 12px 16px; border-radius: 14px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            transition: transform .1s;
        }
        .btn-audio:active { transform: scale(.97); }
        .btn-audio.secondary { background: #e2e8f0; color: #334155; }
        .btn-stop {
            width: 46px; border: none; border-radius: 14px;
            background: #e2e8f0; color: #334155; font-size: 15px; cursor: pointer;
        }

        .hidden { display: none !important; }

        /* ===== MODEL LOADING OVERLAY ===== */
        #model-loading-overlay {
            position: fixed; inset: 0; z-index: 150;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(11, 18, 32, 0.85);
            backdrop-filter: blur(8px);
            color: #fff; text-align: center;
            transition: opacity 0.4s ease;
        }
        #model-loading-overlay.fade-out {
            opacity: 0; pointer-events: none;
        }
        .loading-ring {
            width: 72px; height: 72px;
            border: 4px solid rgba(255,255,255,0.12);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-title {
            font-size: 16px; font-weight: 700;
            margin-top: 20px; letter-spacing: 0.3px;
        }
        .progress-track {
            width: 220px; height: 6px;
            background: rgba(255,255,255,0.12);
            border-radius: 3px; margin-top: 18px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            border-radius: 3px;
            transition: width 0.25s ease;
        }
        .progress-text {
            margin-top: 10px;
            font-size: 12px; font-weight: 500;
            opacity: 0.7;
        }

        /* ===== MESH CLICK FEEDBACK ===== */
        #mesh-feedback {
            position: absolute; bottom: 80px; left: 50%;
            transform: translateX(-50%); z-index: 60;
            padding: 10px 20px; border-radius: 14px;
            font-size: 13px; font-weight: 600;
            backdrop-filter: blur(8px);
            pointer-events: none;
            opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease;
            max-width: 85%; text-align: center;
        }
        #mesh-feedback.show {
            opacity: 1; transform: translateX(-50%) translateY(0);
        }
        #mesh-feedback.success {
            background: rgba(34, 197, 94, 0.9); color: #fff;
        }
        #mesh-feedback.notfound {
            background: rgba(251, 191, 36, 0.9); color: #1e293b;
        }
        #mesh-feedback.nomesh {
            background: rgba(100, 116, 139, 0.85); color: #fff;
        }

        /* ===== TOMBOL AKSI STAGE (muncul setelah model 3D tahap tampil) ===== */
        #stage-cta {
            position: fixed; bottom: 126px; left: 50%;
            transform: translateX(-50%); z-index: 80;
            display: flex; gap: 8px; align-items: center;
            animation: ctaIn .25s ease;
        }
        @keyframes ctaIn {
            from { opacity: 0; transform: translateX(-50%) translateY(14px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        #stage-cta.hidden { display: none; }
        .stage-cta-detail {
            background: #2563eb; color: #fff; border: none;
            padding: 12px 18px; border-radius: 16px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            box-shadow: 0 6px 18px rgba(37, 99, 235, .45);
            white-space: nowrap;
        }
        .stage-cta-detail:active { transform: scale(.97); }
        .stage-cta-close {
            width: 44px; height: 44px; border: none; border-radius: 16px;
            background: rgba(15, 23, 42, .75); color: #fff;
            font-size: 16px; cursor: pointer; backdrop-filter: blur(4px);
        }
        .stage-cta-close:active { transform: scale(.95); }
    </style>
</head>
<body>

    <!-- CONTAINER AR -->
    <div id="app">

        <!--
            FIX #1 (penyebab utama "ngelag"): filterBeta sebelumnya di-set 0.001, jauh di bawah
            nilai wajar MindAR (biasanya ratusan-ribuan). Beta sekecil itu bikin filter
            terlalu "berat" ngikutin gerakan kamera → posisi/orientasi model nyusul telat,
            keliatan kaya lag padahal itu settingan filter, bukan cuma performa HP.
            Sekarang dinaikkan ke 300 (masih ada smoothing biar ga jitter, tapi jauh lebih responsif).
            Kalau di device kamu masih berasa "kaku ngikutin", naikkan lagi ke 500-1000.
            Kalau malah jadi jitter/gemeteran pas diem, turunkan dikit ke 100-200.
        -->
        <a-scene
            id="ar-scene"
            mindar-image="imageTargetSrc: /markers/targets.mind; uiLoading:no; uiError:no; uiScanning:no; autoStart:false; filterMinCF:0.0001; filterBeta:300;"
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <!-- targetIndex & model diisi otomatis dari ?method= (cek script).
                 Model dimuat lazy setelah marker terdeteksi (setAttribute gltf-model).
                 "pivot" = pembungkus untuk gesture (putar/zoom/geser).
                 "model-entity" = khusus normalisasi ukuran & titik tengah otomatis. -->
            <a-entity id="target-entity" mindar-image-target="targetIndex: 1">
                <a-entity id="pivot">
                    <a-entity id="model-entity"></a-entity>
                    <!-- Model 3D detail tahap (menggantikan model utama saat diklik) -->
                    <a-entity id="stage-entity" visible="false"></a-entity>
                </a-entity>
            </a-entity>
        </a-scene>

    </div>

    <!-- START SCREEN -->
    <div id="start-screen">
        <div class="icon">📷</div>
        <h1>Siap Scan Marker AR?</h1>
        <p>Pastikan ruangan terang & internet lancar.<br>
        Gunakan browser <b>Chrome</b> atau <b>Safari</b>.</p>
        <button class="btn-start" onclick="startAR()">Mulai Kamera</button>
    </div>

    <!-- UI OVERLAY -->
    <div id="ui-top">
        <a class="btn-back" href="/home/mulai-belajar">⬅ Kembali</a>
        <div class="title-pill" id="method-title">Metode Agile</div>
        <button class="btn-back" id="btn-reset" style="margin-left:auto" onclick="resetView()">⟲ Reset</button>
    </div>
    <div id="status-pill">Memuat AR...</div>

    <!-- MESH CLICK FEEDBACK -->
    <div id="mesh-feedback"></div>

    <!-- ERROR BANNER -->
    <div id="error-banner">
        <span id="error-msg"></span>
        <button class="btn-retry" onclick="location.reload()">Coba Lagi</button>
    </div>

    <!-- MODEL LOADING OVERLAY -->
    <div id="model-loading-overlay" class="hidden">
        <div class="loading-ring"></div>
        <div class="loading-title">Memuat Model 3D</div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-text" id="progress-text">Mengunduh...</div>
    </div>

    <!-- TOMBOL AKSI SAAT MODEL TAHAP TAMPIL (popup menyusul saat diklik) -->
    <div id="stage-cta" class="hidden">
        <button class="stage-cta-detail" onclick="openDetailFromStage()">📋 Lihat Penjelasan</button>
        <button class="stage-cta-close" onclick="hideStageModel()" aria-label="Kembali ke model utama">✕</button>
    </div>

    <!-- POPUP DETAIL -->
    <div id="popup-backdrop" class="hidden" onclick="closePopup()"></div>
    <div id="popup-wrap" class="hidden">
        <div id="popup">
            <div class="popup-header">
                <div>
                    <h3 id="popup-title"></h3>
                    <p id="popup-desc"></p>
                </div>
                <button class="btn-close" onclick="closePopup()">✕</button>
            </div>
            <div class="popup-body"><p id="popup-content"></p></div>
            <div class="popup-footer">
                <button class="btn-audio" id="btn-audio" onclick="toggleAudio()">▶ Dengarkan</button>
                <button class="btn-stop hidden" id="btn-stop" onclick="stopAudio()">■</button>
            </div>
        </div>
    </div>

    <script>
        // ================= URL PARAMS =================
        const urlParams = new URLSearchParams(window.location.search);
        const methodSlug = urlParams.get("method") || "agile";
        // Fix bug: kadang slug keisi "ar.html" dari URL routing — strip .html
        const cleanSlug = methodSlug.replace(/\.html$/, "") || "agile";

        // ================= STATE =================
        let methodCfg = { targetIndex: 1, modelPath: "https://models.byvictech.site/models/agile-new.glb", name: cleanSlug };
        let stepsData = {};
        let currentStep = null;
        let isTracking = false;
        let modelLoaded = false;
        let modelLoading = false;
        let dataLoaded = false;

        // ================= UI INIT (show something immediately) =================
        document.getElementById("method-title").textContent = "Memuat...";

        // ================= LOAD DATA FROM DATABASE (dynamic-first) =================
        const API_TIMEOUT = 5000;

        // FIX: komponen "mindar-image-target" MindAR cuma baca targetIndex SEKALI
        // di init() (registerAnchor) — setAttribute setelah itu TIDAK ngaruh ke
        // anchor yang sudah terdaftar. Akibatnya semua metode tetap dengerin index 1.
        // Solusi: set attribute + patch langsung anchorEntities milik system.
        function applyTargetIndex(idx) {
            const sceneEl = document.getElementById("ar-scene");
            const targetEl = document.getElementById("target-entity");
            targetEl.setAttribute("mindar-image-target", "targetIndex: " + idx);

            const system = sceneEl.systems && sceneEl.systems["mindar-image-system"];
            if (!system || !system.anchorEntities) {
                console.log("[AR] targetIndex via attribute (system belum init):", idx);
                return;
            }

            system.anchorEntities.forEach((anchor) => {
                if (anchor.el === targetEl.components["mindar-image-target"]) {
                    anchor.targetIndex = idx;
                    // Setup ulang dimensi marker biar postMatrix sesuai target baru
                    const dims = system.controller && system.controller.markerDimensions;
                    if (dims && dims[idx] && typeof anchor.setupMarker === "function") {
                        anchor.setupMarker(dims[idx]);
                    }
                }
            });
            console.log("[AR] targetIndex di-patch ke anchor:", idx);
        }

        async function loadFromDB() {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), API_TIMEOUT);
            try {
                const res = await fetch("/api/methods/by-slug/" + cleanSlug, { signal: controller.signal });
                clearTimeout(timer);
                if (!res.ok) throw new Error("API " + res.status);
                const data = await res.json();

                // Update method config dari DB
                methodCfg = {
                    targetIndex: data.mindTargetIndex ?? 1,
                    modelPath: data.modelPath || methodCfg.modelPath,
                    name: data.name || cleanSlug,
                };

                console.log("[DB] Method:", methodCfg.name);
                console.log("[DB] Model source:", data.modelPath ? "DATABASE" : "FALLBACK (hardcoded)");
                console.log("[DB] Model path:", methodCfg.modelPath);
                console.log("[DB] Target index:", methodCfg.targetIndex);

                // Update UI
                applyTargetIndex(methodCfg.targetIndex);
                document.title = "AR SDLC - " + methodCfg.name;
                document.getElementById("method-title").textContent = "Metode " + methodCfg.name;

                // Build stepsData dari DB — langsung pakai tanpa match fallback
                stepsData = {};
                if (data.steps && Array.isArray(data.steps)) {
                    data.steps.forEach(function(s) {
                        if (s.meshName) stepsData[s.meshName] = s;
                    });
                }

                dataLoaded = true;
                console.log("Data loaded from DB:", methodCfg.name, "steps:", Object.keys(stepsData).length);

                // Pre-load model DISABLED — sudah di-cache dari card click di mulai-belajar
                // preloadModel(methodCfg.modelPath);
            } catch (e) {
                clearTimeout(timer);
                console.warn("DB load failed (" + e.message + "), using fallback config");
                console.log("[Fallback] Using hardcoded model:", methodCfg.modelPath);
                // Apply fallback config
                applyTargetIndex(methodCfg.targetIndex);
                document.title = "AR SDLC - " + methodCfg.name;
                document.getElementById("method-title").textContent = "Metode " + methodCfg.name;
            }
        }

        // ================= PRE-LOAD MODEL (cache di awal, bukan saat scan) =================
        let modelPreloaded = false;

        async function preloadModel(url) {
            if (modelPreloaded) return;
            modelPreloaded = true;

            console.log("[Preload] Starting model pre-cache from:", url);
            setStatus("Mengunduh model 3D...");

            const overlay = document.getElementById("model-loading-overlay");
            const fill = document.getElementById("progress-fill");
            const text = document.getElementById("progress-text");

            overlay.classList.remove("hidden", "fade-out");
            fill.style.width = "0%";
            text.textContent = "Mengunduh...";

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("HTTP " + response.status);

                const contentLength = +(response.headers.get("Content-Length") || 0);
                const reader = response.body.getReader();
                var received = 0;
                var chunks = [];

                function pump() {
                    return reader.read().then(function(result) {
                        if (result.done) {
                            var blob = new Blob(chunks, { type: "model/gltf-binary" });
                            console.log("[Preload] Download complete. Size:", (received / 1048576).toFixed(1) + " MB");
                            fill.style.width = "100%";
                            text.textContent = "Siap untuk di-scan!";
                            setStatus("Model siap. Arahkan kamera ke marker AR");
                            
                            // Cache model ke SW
                            if ('caches' in window) {
                                caches.open("ar-models-v1").then(function(cache) {
                                    var blobUrl = URL.createObjectURL(blob);
                                    return fetch(blobUrl).then(function(blobRes) {
                                        cache.put(url, blobRes.clone());
                                        URL.revokeObjectURL(blobUrl);
                                        console.log("[Cache] Model cached ke SW");
                                    });
                                });
                            }

                            // Fade out overlay setelah 2 detik
                            setTimeout(() => {
                                overlay.classList.add("fade-out");
                                setTimeout(() => overlay.classList.add("hidden"), 400);
                            }, 2000);
                            return;
                        }

                        chunks.push(result.value);
                        received += result.value.length;

                        if (contentLength > 0) {
                            var pct = Math.round((received / contentLength) * 100);
                            fill.style.width = pct + "%";
                            text.textContent = "Mengunduh... " + pct + "% (" +
                                (received / 1048576).toFixed(1) + " / " +
                                (contentLength / 1048576).toFixed(1) + " MB)";
                        } else {
                            text.textContent = "Mengunduh... " +
                                (received / 1048576).toFixed(1) + " MB";
                        }
                        return pump();
                    });
                }
                return pump();
            } catch (e) {
                console.error("[Preload] Failed:", e.message);
                setStatus("Model gagal di-download. Cek koneksi internet.");
                overlay.classList.add("hidden");
            }
        }

        // ================= LOAD MODEL FROM CACHE (instant, no download) =================
        function loadModelFromCache(url) {
            if (modelLoaded) {
                console.log("[LoadCache] Model already loaded, skipping");
                return;
            }
            if (modelLoading) {
                console.log("[LoadCache] Model already loading, skipping");
                return;
            }
            modelLoading = true;

            console.log("[LoadCache] ========== LOADING FROM CACHE ==========");
            console.log("[LoadCache] URL:", url);
            setStatus("Memuat model dari cache...");

            const overlay = document.getElementById("model-loading-overlay");
            overlay.classList.remove("hidden", "fade-out");

            if ('caches' in window) {
                console.log("[LoadCache] Opening cache store 'ar-models-v1'...");
                caches.open("ar-models-v1").then(function(cache) {
                    console.log("[LoadCache] Cache opened. Listing all cached URLs...");
                    return cache.keys().then(function(requests) {
                        console.log("[LoadCache] Cached URLs:", requests.map(r => r.url));
                        console.log("[LoadCache] Matching URL:", url);
                        return cache.match(url);
                    }).then(function(response) {
                        if (response) {
                            console.log("[LoadCache] ✓✓✓ CACHE HIT! Loading instantly");
                            return response.blob();
                        } else {
                            console.warn("[LoadCache] ✗✗✗ CACHE MISS. Fallback to fetch");
                            console.warn("[LoadCache] Requested URL:", url);
                            return fetch(url).then(function(res) {
                                if (!res.ok) throw new Error("HTTP " + res.status);
                                console.log("[LoadCache] Fetch successful, converting to blob");
                                return res.blob();
                            });
                        }
                    });
                }).then(function(blob) {
                    console.log("[LoadCache] Blob ready. Size:", (blob.size / 1048576).toFixed(1), "MB");
                    var blobURL = URL.createObjectURL(blob);
                    var modelEl = document.getElementById("model-entity");
                    console.log("[LoadCache] Setting gltf-model attribute on entity");
                    setStatus("Memuat model 3D ke kamera...");
                    modelEl.setAttribute("gltf-model", blobURL);
                    // JANGAN sembunyiin overlay di sini.
                    // Biarkan event "model-loaded" (listener di init()) yang menutupnya —
                    // GLB butuh waktu parse (Draco decompress) setelah setAttribute.
                    console.log("[LoadCache] gltf-model set. Waiting for model-loaded event...");
                }).catch(function(e) {
                    console.error("[LoadCache] ✗✗✗ FAILED:", e.message, e);
                    setStatus("Gagal load model: " + e.message);
                    overlay.classList.add("hidden");
                });
            } else {
                console.warn("[LoadCache] Cache API not available, fallback to direct fetch");
                fetch(url)
                    .then(function(res) {
                        if (!res.ok) throw new Error("HTTP " + res.status);
                        return res.blob();
                    })
                    .then(function(blob) {
                        var blobURL = URL.createObjectURL(blob);
                        var modelEl = document.getElementById("model-entity");
                        setStatus("Memuat model 3D ke kamera...");
                        modelEl.setAttribute("gltf-model", blobURL);
                        // Overlay ditutup oleh event "model-loaded"
                    });
            }
        }

        // ================= START AR =================
        function startAR() {
            // Kamera wajib HTTPS (kecuali localhost/127.0.0.1).
            // Di HP yang dibuka via http://IP, browser menolak kamera walau sudah diizinkan.
            const host = window.location.hostname;
            const secureOK = window.location.protocol === "https:" ||
                host === "localhost" || host === "127.0.0.1";
            if (!secureOK) {
                showError("Kamera hanya bisa aktif saat halaman dibuka via HTTPS (mis. URL Vercel). Alamat http://IP biasa ditolak browser di HP.");
                return;
            }

            const sceneEl = document.getElementById("ar-scene");

            const begin = () => {
                const arSystem = sceneEl.systems && sceneEl.systems["mindar-image-system"];
                if (!arSystem) {
                    showError("Engine AR belum siap. Periksa koneksi internet lalu muat ulang halaman.");
                    return;
                }
                try {
                    arSystem.start();
                } catch (e) {
                    console.error("MindAR start error:", e);
                    showError("Gagal mulai kamera AR. Tutup lalu buka ulang halaman, dan izinkan lagi akses kameranya.");
                }
            };

            document.getElementById("start-screen").classList.add("hidden");

            // Di HP yang lambat scene bisa belum siap saat tombol ditekan.
            // Tunggu event "loaded" dulu agar arSystem.start() benar-benar berjalan.
            if (sceneEl.hasLoaded) {
                begin();
            } else {
                sceneEl.addEventListener("loaded", begin, { once: true });
            }
        }

        // ================= STATUS =================

        function setStatus(text) {
            document.getElementById("status-pill").textContent = text;
        }

        function showError(text) {
            document.getElementById("error-msg").textContent = text;
            document.getElementById("error-banner").style.display = "block";
        }

        function hideError() {

        // ================= MESH CLICK FEEDBACK =================
        var feedbackTimer = null;

        function showMeshFeedback(text, type) {
            var el = document.getElementById("mesh-feedback");
            el.textContent = text;
            el.className = type + " show";
            clearTimeout(feedbackTimer);
            feedbackTimer = setTimeout(function() {

        // ================= MODEL DOWNLOAD WITH PROGRESS =================
        function loadModelWithProgress(url) {
            console.log("[Model] Loading from URL:", url);

            const overlay = document.getElementById("model-loading-overlay");
            const fill = document.getElementById("progress-fill");
            const text = document.getElementById("progress-text");

            overlay.classList.remove("hidden", "fade-out");
            fill.style.width = "0%";
            text.textContent = "Mengunduh...";
            setStatus("Memuat model 3D...");

            fetch(url)
                .then(function(response) {
                    if (!response.ok) throw new Error("HTTP " + response.status);
                    var contentLength = +(response.headers.get("Content-Length") || 0);
                    var reader = response.body.getReader();
                    var received = 0;
                    var chunks = [];

                    function pump() {
                        return reader.read().then(function(result) {
                            if (result.done) {
                                var blob = new Blob(chunks, {
                                    type: "model/gltf-binary"
                                });
                                var blobURL = URL.createObjectURL(blob);
                                console.log("[Model] Download complete. Size:", (received / 1048576).toFixed(1) + " MB");
                                fill.style.width = "100%";
                                text.textContent = "Memuat model ke kamera...";
                                var model = document.getElementById("model-entity");
                                model.setAttribute("gltf-model", blobURL);
                                return;
                            }
                            chunks.push(result.value);
                            received += result.value.length;

                            if (contentLength > 0) {
                                var pct = Math.round((received / contentLength) * 100);
                                fill.style.width = pct + "%";
                                text.textContent = "Mengunduh... " + pct + "% (" +
                                    (received / 1048576).toFixed(1) + " / " +
                                    (contentLength / 1048576).toFixed(1) + " MB)";
                            } else {
                                text.textContent = "Mengunduh... " +
                                    (received / 1048576).toFixed(1) + " MB";
                            }
                            return pump();
                        });
                    }
                    return pump();
                })
                .catch(function(e) {
                    console.error("Model download failed:", e);
                    overlay.classList.add("hidden");
                    showError("Gagal memuat model 3D. Cek koneksi internet, lalu coba lagi.");
                    setStatus("Model 3D gagal dimuat");
                    modelLoading = false;
                });
        }

        // ================= CLICK / RAYCASTER =================
        function getCameras() {
            const sceneEl = document.getElementById("ar-scene");
            const list = [];
            if (sceneEl && sceneEl.camera) list.push(sceneEl.camera);
            const camEl = sceneEl.querySelector("a-camera");
            if (camEl && camEl.components.camera && camEl.components.camera.camera) {
                list.push(camEl.components.camera.camera);
            }
            return list.filter((c, i) => c && list.indexOf(c) === i);
        }

        // Ambil nama tahap dari objek mesh; nama bisa ada di mesh itu sendiri
        // atau di parent-nya (Group). Sesuai mesh name yang dipakai admin.
        // Prioritas: nama yang COCOK dengan stepsData (DB) duluan.
        // Ini nge-handle kasus klik di text/child mesh (misal "Text002")
        // yang parent-nya adalah "AG_DESIGN".
        function resolveMeshName(obj) {
            let cur = obj;
            let firstName = null;
            while (cur) {
                const n = cur.name && cur.name.trim();
                if (n) {
                    if (stepsData[n]) return n;   // cocok DB → pakai ini
                    if (!firstName) firstName = n; // cadangan: nama pertama
                }
                cur = cur.parent;
            }
            return firstName;
        }

        // Highlight (kedip hijau) semua mesh milik tahap yang diklik,
        // biar user tau bagian mana yang ke-deteksi.
        function highlightStage(stageName) {
            const modelEl = document.getElementById("model-entity");
            if (!modelEl || !modelEl.object3D) return;
            const toRestore = [];
            modelEl.object3D.traverse((child) => {
                if (!child.isMesh || !child.material) return;
                if (resolveMeshName(child) !== stageName) return;
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                mats.forEach((m) => {
                    if (!m.emissive) return;
                    toRestore.push({ m, color: m.emissive.getHex() });
                    m.emissive.setHex(0x00ff66);
                });
            });
            if (toRestore.length === 0) return;
            console.log("[Highlight] Mesh \"" + stageName + "\" di-highlight (" + toRestore.length + " material)");
            setTimeout(() => {
                toRestore.forEach(({ m, color }) => m.emissive.setHex(color));
            }, 700);
        }

        // Cari nama mesh tahap yang menutupi titik klik.
        // Jika raycast gagal, fallback ke tahap terdekat dari proyeksi layar.
        function findStageNameAt(clientX, clientY, camera) {
            const sceneEl = document.getElementById("ar-scene");
            const modelEl = document.getElementById("model-entity");
            const canvas = sceneEl.canvas || (sceneEl.renderer && sceneEl.renderer.domElement);
            if (!camera || !modelEl || !modelEl.object3D) return null;

            const rect = canvas && canvas.getBoundingClientRect
                ? canvas.getBoundingClientRect()
                : { width: window.innerWidth, height: window.innerHeight, left: 0, top: 0 };
            const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
            const ny = -((clientY - rect.top) / rect.height) * 2 + 1;

            camera.updateMatrixWorld(true);
            modelEl.object3D.updateWorldMatrix(true, true);

            const meshes = [];
            modelEl.object3D.traverse((child) => {
                if (child.isMesh) meshes.push(child);
            });
            if (meshes.length === 0) return null;

            const raycaster = new AFRAME.THREE.Raycaster();
            raycaster.setFromCamera(new AFRAME.THREE.Vector2(nx, ny), camera);

            const intersects = raycaster.intersectObjects(meshes, true);
            if (intersects.length > 0) {
                const name = resolveMeshName(intersects[0].object);
                if (name) return name;
            }

            // Fallback: cari mesh yang menutupi titik klik pakai bounding sphere.
            // Lebih akurat dari sekadar center karena memperhitungkan ukuran mesh di layar.
            const worldPos = new AFRAME.THREE.Vector3();
            const box = new AFRAME.THREE.Box3();
            const size = new AFRAME.THREE.Vector3();
            let bestName = null;
            let bestDist = Infinity;
            for (const mesh of meshes) {
                const name = resolveMeshName(mesh);
                if (!name) continue;
                box.setFromObject(mesh);
                box.getSize(size);
                const radius = size.length() * 0.5;
                mesh.getWorldPosition(worldPos);
                const projected = worldPos.project(camera);
                if (projected.z < -1 || projected.z > 1) continue;
                const sx = (projected.x + 1) / 2 * rect.width + rect.left;
                const sy = (-projected.y + 1) / 2 * rect.height + rect.top;
                // Estimasi radius mesh di layar (pixels)
                const screenRadius = Math.max(
                    (box.max.x - box.min.x) * 0.5 * rect.width * 0.5,
                    (box.max.y - box.min.y) * 0.5 * rect.height * 0.5,
                    40
                );
                const d = Math.hypot(sx - clientX, sy - clientY);
                if (d < screenRadius + 30 && d < bestDist) {
                    bestDist = d;
                    bestName = name;
                }
            }
            return bestName;
        }

        function handleClick(clientX, clientY) {
            if (!isTracking || !modelLoaded) return;
            if (currentStep) return;
            if (stageStep) return; // mode model tahap aktif → pakai tombol, bukan ketuk bebas

            for (const camera of getCameras()) {
                const name = findStageNameAt(clientX, clientY, camera);
                if (!name) continue;
                console.log("[Click] Detected mesh:", name, "| in DB:", !!stepsData[name]);
                if (stepsData[name]) {
                    highlightStage(name);
                    showMeshFeedback("✓ " + stepsData[name].title + "  (" + name + ")", "success");
                    if (showStageModel(stepsData[name], name)) {
                        // Model tahap tampil dulu → popup menyusul saat tombol diklik
                        showStageCTA();
                    } else {
                        openPopup(stepsData[name]); // tanpa model tahap → perilaku lama
                    }
                    return;
                }
                // Mesh ketemu tapi ga ada di data admin → tampilin nama mesh-nya
                showMeshFeedback("⚠ Mesh \"" + name + "\" belum ada di data admin", "notfound");
                return;
            }
            showMeshFeedback("Tidak ada bagian model yang terdeteksi", "nomesh");
        }

        // ================= GESTURE (tap, putar, zoom, geser) =================
        // Pointer events dipakai jika tersedia; jika tidak, fallback ke touch & mouse.
        // Seleksi tahap dilakukan lewat event "click" (bukan touchend/pointerup)
        // agar popup tidak langsung tertutup oleh click palsu dari browser.
        //
        // Kontrol:
        //  - 1 jari geser kiri/kanan  = putar (sumbu Y, bebas)
        //  - 1 jari geser atas/bawah  = miring atas/bawah (sumbu X, DIBATASI min/max)
        //  - 2 jari pinch             = zoom in/out
        //  - 2 jari geser             = pindah posisi model
        //  - tombol Reset             = kembali ke tampilan awal
        // Semua input hanya menulis ke TARGET, lalu animateModel() men-smooth
        // nilai current -> target tiap frame (lerp), terpisah dari rate event sentuhan.

        // ---------- Konfigurasi (silakan di-tweak) ----------
        const FIT_SIZE = 1.0;          // ukuran sisi terpanjang model = 1x lebar marker. Mau semua lebih besar/kecil? ubah ini.
        const ROT_SENS = 0.010;        // sensitivitas putar
        const ROT_X_MIN = -0.45;       // batas lihat dari bawah (radian, ~ -26°)
        const ROT_X_MAX = 0.90;        // batas lihat dari atas  (radian, ~ +52°)
        const ZOOM_MIN = 0.4;
        const ZOOM_MAX = 3.5;
        const PAN_SPEED = 0.003;       // seberapa jauh model bergeser per pixel (2 jari)
        const PAN_LIMIT = 1.5;         // batas geser dari tengah marker
        const LERP = 0.2;              // 0-1, makin besar makin responsif
        const INERTIA_DECAY = 0.92;
        const INERTIA_MIN = 0.0003;

        const VIEW_DEFAULT = { ry: 0, rx: 0, px: 0, py: 0, z: 1 };
        const view = {
            c: Object.assign({}, VIEW_DEFAULT), // current (yang tampil)
            t: Object.assign({}, VIEW_DEFAULT), // target (hasil gesture)
            vx: 0, vy: 0                         // inertia putar
        };

        const gesture = {
            pointers: new Map(),
            startX: 0, startY: 0,
            lastX: 0, lastY: 0,
            dragging: false,
            pinching: false,
            pinchStartDist: 0,
            pinchBaseZoom: 1,
            lastMidX: 0, lastMidY: 0,
        };
        let pendingTap = false;

        function pointDist(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        function getGesturePoints() {
            return Array.from(gesture.pointers.values());
        }

        function gestureDown(id, x, y) {
            const pts = gesture.pointers;
            if (pts.size >= 2 || pts.has(id)) return;
            pts.set(id, { x, y });
            if (pts.size === 1) {
                gesture.startX = gesture.lastX = x;
                gesture.startY = gesture.lastY = y;
                gesture.dragging = false;
                gesture.pinching = false;
                view.vx = view.vy = 0; // stop inertia begitu disentuh lagi
            } else if (pts.size === 2) {
                gesture.pinching = true;
                const arr = getGesturePoints();
                gesture.pinchStartDist = pointDist(arr[0], arr[1]);
                gesture.pinchBaseZoom = view.t.z;
                gesture.lastMidX = (arr[0].x + arr[1].x) / 2;
                gesture.lastMidY = (arr[0].y + arr[1].y) / 2;
            }
        }

        function gestureMove(id, x, y) {
            const pts = gesture.pointers;
            if (!pts.has(id)) return;
            pts.set(id, { x, y });
            if (pts.size === 1) {
                const dx = x - gesture.lastX;
                const dy = y - gesture.lastY;
                if (Math.abs(x - gesture.startX) > 8 ||
                    Math.abs(y - gesture.startY) > 8) {
                    gesture.dragging = true;
                }
                if (gesture.dragging && modelLoaded) {
                    // Hanya update TARGET. Nilai aktualnya di-smooth di animateModel().
                    view.t.ry += dx * ROT_SENS;
                    // Miring atas/bawah dibatasi min/max (tidak bisa salto)
                    view.t.rx = clamp(view.t.rx + dy * ROT_SENS, ROT_X_MIN, ROT_X_MAX);
                    view.vx = dx * ROT_SENS; // dipakai buat inertia pas jari dilepas
                    view.vy = dy * ROT_SENS;
                }
                gesture.lastX = x;
                gesture.lastY = y;
            } else if (pts.size === 2 && gesture.pinchStartDist && modelLoaded) {
                const arr = getGesturePoints();
                // Zoom (pinch)
                const d = pointDist(arr[0], arr[1]);
                view.t.z = clamp(gesture.pinchBaseZoom * (d / gesture.pinchStartDist), ZOOM_MIN, ZOOM_MAX);
                // Geser posisi (gerak titik tengah dua jari)
                const mx = (arr[0].x + arr[1].x) / 2;
                const my = (arr[0].y + arr[1].y) / 2;
                view.t.px = clamp(view.t.px + (mx - gesture.lastMidX) * PAN_SPEED, -PAN_LIMIT, PAN_LIMIT);
                view.t.py = clamp(view.t.py - (my - gesture.lastMidY) * PAN_SPEED, -PAN_LIMIT, PAN_LIMIT);
                gesture.lastMidX = mx;
                gesture.lastMidY = my;
            }
        }

        function gestureUp(id, x, y) {
            const pts = gesture.pointers;
            if (!pts.has(id)) return;
            pts.delete(id);
            if (pts.size === 0) {
                pendingTap = !gesture.dragging && !gesture.pinching;
                gesture.dragging = false;
                gesture.pinching = false;
                gesture.pinchStartDist = 0;
            } else if (pts.size === 1) {
                gesture.pinchStartDist = 0;
                gesture.pinching = false;
                const remaining = getGesturePoints()[0];
                gesture.startX = gesture.lastX = remaining.x;
                gesture.startY = gesture.lastY = remaining.y;
                gesture.dragging = false;
                view.vx = view.vy = 0;
            }
        }

        function clearGesture() {
            gesture.pointers.clear();
            gesture.dragging = false;
            gesture.pinching = false;
            gesture.pinchStartDist = 0;
        }

        function clamp(v, min, max) {
            return Math.min(Math.max(v, min), max);
        }

        // Kembalikan posisi/zoom/rotasi ke awal (dipanggil tombol Reset)
        function resetView() {
            view.vx = view.vy = 0;
            // putar lewat jalur terdekat supaya tidak muter balik banyak kali
            const turn = Math.PI * 2;
            view.t = Object.assign({}, VIEW_DEFAULT, { ry: Math.round(view.c.ry / turn) * turn });
        }

        // Normalisasi: semua model otomatis di-fit ke FIT_SIZE & dipusatkan,
        // jadi ukuran awalnya seragam walau model aslinya beda-beda.
        function normalizeModel() {
            const model = document.getElementById("model-entity");
            const pivot = document.getElementById("pivot");
            const root = model.object3D;
            const THREE = AFRAME.THREE;

            root.position.set(0, 0, 0);
            root.scale.set(1, 1, 1);
            root.rotation.set(0, 0, 0);
            root.updateMatrixWorld(true);

            // Hitung bounding box di ruang lokal model (tidak terpengaruh posisi marker)
            const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
            const box = new THREE.Box3();
            const tmp = new THREE.Box3();
            root.traverse((o) => {
                if (!o.isMesh || !o.geometry) return;
                if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
                tmp.copy(o.geometry.boundingBox).applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
                box.union(tmp);
            });
            if (box.isEmpty()) { console.warn("[Fit] bounding box kosong, skip normalisasi"); return; }

            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const fit = FIT_SIZE / maxDim;

            root.scale.setScalar(fit);
            root.position.copy(center).multiplyScalar(-fit); // titik tengah model = titik tengah pivot
            console.log("[Fit] size:", size.toArray().map(n => n.toFixed(2)), "scale:", fit.toFixed(4));

            pivot.object3D.rotation.order = "YXZ"; // yaw dulu, baru pitch -> terasa seperti turntable
            resetView();
            Object.assign(view.c, view.t);
        }

        // ================= RENDER-LOOP SMOOTHING (rotate + zoom + geser) =================
        // Loop ini jalan terus tiap frame lewat requestAnimationFrame, independen dari
        // seberapa sering event pointermove ditembak HP. Ini kunci utama biar putar &
        // zoom kerasa smooth walau device-nya kurang kencang.
        function animateModel() {
            const pivot = document.getElementById("pivot");
            if (pivot && pivot.object3D && modelLoaded) {
                // --- Inertia: kalau lagi ga di-drag dan masih ada sisa "kecepatan", terus geser target ---
                if (!gesture.dragging && (Math.abs(view.vx) > INERTIA_MIN || Math.abs(view.vy) > INERTIA_MIN)) {
                    view.t.ry += view.vx;
                    view.t.rx = clamp(view.t.rx + view.vy, ROT_X_MIN, ROT_X_MAX);
                    view.vx *= INERTIA_DECAY;
                    view.vy *= INERTIA_DECAY;
                } else if (!gesture.dragging) {
                    view.vx = view.vy = 0;
                }

                // --- Smooth semua nilai menuju target ---
                const c = view.c, t = view.t;
                for (const k of ["ry", "rx", "px", "py", "z"]) c[k] += (t[k] - c[k]) * LERP;

                pivot.object3D.rotation.set(c.rx, c.ry, 0);
                pivot.object3D.position.set(c.px, c.py, 0);
                pivot.object3D.scale.setScalar(c.z);
            }
            requestAnimationFrame(animateModel);
        }
        requestAnimationFrame(animateModel);

        function setupGestures() {
            const sceneEl = document.getElementById("ar-scene");
            if (!sceneEl) return;
            // Dengar event di elemen <a-scene>, bukan objek canvas.
            // Elemen scene selalu ada, jadi event tetap tertangkap walau canvas
            // dibuat ulang oleh A-Frame/MindAR.
            sceneEl.style.touchAction = "none";

            if (window.PointerEvent) {
                sceneEl.addEventListener("pointerdown", (e) => {
                    if (e.button !== undefined && e.button !== 0 && e.pointerType === "mouse") return;
                    gestureDown(e.pointerId, e.clientX, e.clientY);
                });
                sceneEl.addEventListener("pointermove", (e) => {
                    gestureMove(e.pointerId, e.clientX, e.clientY);
                });
                sceneEl.addEventListener("pointerup", (e) => {
                    gestureUp(e.pointerId, e.clientX, e.clientY);
                });
                sceneEl.addEventListener("pointercancel", clearGesture);
            } else {
                sceneEl.addEventListener("touchstart", (e) => {
                    for (const t of e.touches) gestureDown(t.identifier, t.clientX, t.clientY);
                }, { passive: true });
                sceneEl.addEventListener("touchmove", (e) => {
                    for (const t of e.changedTouches) gestureMove(t.identifier, t.clientX, t.clientY);
                }, { passive: true });
                sceneEl.addEventListener("touchend", (e) => {
                    for (const t of e.changedTouches) gestureUp(t.identifier, t.clientX, t.clientY);
                }, { passive: true });
                sceneEl.addEventListener("touchcancel", clearGesture, { passive: true });

                sceneEl.addEventListener("mousedown", (e) => {
                    if (e.button === 0) gestureDown(0, e.clientX, e.clientY);
                });
                window.addEventListener("mousemove", (e) => {
                    gestureMove(0, e.clientX, e.clientY);
                });
                window.addEventListener("mouseup", (e) => {
                    gestureUp(0, e.clientX, e.clientY);
                });
            }

            // Seleksi tahap lewat event click (sudah pasti tap, bukan drag)
            sceneEl.addEventListener("click", (e) => {
                if (!pendingTap) return;
                pendingTap = false;
                handleClick(e.clientX, e.clientY);
            });

            // Cegah konteks menu kanan saat tap & tahan
            sceneEl.addEventListener("contextmenu", (e) => e.preventDefault());
        }

        // ================= STAGE 3D (model detail per tahap) =================
        // Saat mesh tahap diklik, model utama disembunyikan dan DIGANTIKAN oleh
        // model 3D tahapan tersebut di atas marker (popup teks tetap di bawah).
        // Dua sumber model, urutan prioritas:
        //  1. GLB dari database  → step.stageModelUrl (file di R2, diisi via admin)
        //  2. Model hardcode     → bawaan ar.html per jenis tahap (requirements,
        //     design, coding, testing, deployment, maintenance, review)
        // Kalau dua-duanya tidak ada → tampilan normal (model utama tetap terlihat).
        let stageToken = 0;   // dinaikkan saat keluar mode tahap → membatalkan proses async
        let stageStep = null; // step yang model tahapnya sedang tampil (mode tahap aktif)

        // ===== Tombol aksi (CTA) — muncul setelah model tahap tampil =====
        function showStageCTA() {
            const cta = document.getElementById("stage-cta");
            if (cta) cta.classList.remove("hidden");
        }
        function hideStageCTA() {
            const cta = document.getElementById("stage-cta");
            if (cta) cta.classList.add("hidden");
        }
        // Dari tombol "📋 Lihat Penjelasan" → buka popup detail (teks + TTS)
        function openDetailFromStage() {
            if (stageStep) openPopup(stageStep);
        }

        function detectStageType(meshName) {
            const n = String(meshName || "").toUpperCase();
            if (/MAINTENANCE/.test(n)) return "maintenance";
            if (/REVIEW|FEEDBACK/.test(n)) return "review";
            if (/DEPLOY|CUTOVER|LAUNCH|RELEASE/.test(n)) return "deployment";
            if (/TEST/.test(n)) return "testing";
            if (/IMPLEMENT|DEVELOP|CONSTRUCTION|CODING/.test(n)) return "coding";
            if (/DESIGN/.test(n)) return "design";
            if (/REQUIREMENT|ANALYS|PLANN/.test(n)) return "requirements";
            return null;
        }

        function stageEntity(attrs) {
            const el = document.createElement("a-entity");

                geometry: "primitive: box; width: " + w + "; height: " + h + "; depth: " + d,

                position: position,

                material: "color: #e2e8f0; roughness: 0.85",

        // Sembunyikan model tahap & tampilkan lagi model utama (panggil saat popup ditutup)
        function hideStageModel() {
            stageToken++;
            stageStep = null;
            const stageEl = document.getElementById("stage-entity");
            const modelEl = document.getElementById("model-entity");
            if (stageEl) {
                while (stageEl.firstChild) stageEl.removeChild(stageEl.firstChild);
                stageEl.setAttribute("visible", false);
            }
            if (modelEl) modelEl.setAttribute("visible", true);
            hideStageCTA();
        }

        // Tukar tampilan: model utama off → model tahap on, view kembali tegak (mulus via lerp)
        function activateStageSwap() {
            document.getElementById("model-entity").setAttribute("visible", false);
            document.getElementById("stage-entity").setAttribute("visible", true);
            resetView();
        }

        // Fit-kan GLB tahap ke ukuran standar (sama seperti normalizeModel utama)
        function fitStageGltf(el) {
            try {
                const THREE = AFRAME.THREE;
                const root = el.object3D;
                root.position.set(0, 0, 0);
                root.scale.set(1, 1, 1);
                root.rotation.set(0, 0, 0);
                root.updateMatrixWorld(true);
                const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
                const box = new THREE.Box3();
                const tmp = new THREE.Box3();
                root.traverse((o) => {
                    if (!o.isMesh || !o.geometry) return;
                    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
                    tmp.copy(o.geometry.boundingBox)
                        .applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
                    box.union(tmp);
                });
                if (box.isEmpty()) return;
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z) || 1;
                const fit = FIT_SIZE / maxDim;
                root.scale.setScalar(fit);
                root.position.copy(center).multiplyScalar(-fit);
                console.log("[Stage] GLB fit — size:", size.toArray().map((n) => n.toFixed(2)),
                    "scale:", fit.toFixed(3));
            } catch (e) {
                console.warn("[Stage] fit GLB gagal:", e);
            }
        }

        // Titik masuk: dipanggil dari handleClick saat mesh dengan data admin diklik.
        // Return true = model tahap sedang diproses/tampil → pakai tombol CTA;
        // Return false = tidak ada model tahap → buka popup langsung (perilaku lama).
        function showStageModel(step, meshName) {
            const stageEl = document.getElementById("stage-entity");
            if (!stageEl) return false;
            hideStageModel();          // bersihkan state lama + ambil token baru
            const token = stageToken;
            const url = step && step.stageModelUrl
                ? String(step.stageModelUrl).trim() : "";
            const type = detectStageType(meshName);

            if (url) {
                console.log("[Stage] Muat GLB tahap dari database:", url);
                stageStep = step;
                const child = document.createElement("a-entity");
                child.setAttribute("gltf-model", "url(" + url + ")");
                child.addEventListener("model-loaded", function () {
                    if (token !== stageToken) return;   // sudah keluar mode tahap → batal
                    fitStageGltf(child);
                    activateStageSwap();
                    console.log("[Stage] GLB tahap tampil");
                });
                child.addEventListener("model-error", function () {
                    if (token !== stageToken) return;
                    console.warn("[Stage] GLB gagal → fallback:", type || "tampilan normal");
                    if (child.parentNode) child.parentNode.removeChild(child);
                    if (type) {
                        stageEl.appendChild(STAGE_BUILDERS[type]());
                        activateStageSwap();
                    }
                });
                stageEl.appendChild(child);
                return true;           // tampilan menyusul setelah model siap
            }

            if (type && STAGE_BUILDERS[type]) {
                stageStep = step;
                stageEl.appendChild(STAGE_BUILDERS[type]());
                activateStageSwap();
                console.log("[Stage] Model hardcode:", type, "| mesh:", meshName);
                return true;
            }
            console.log("[Stage] Tanpa model (URL kosong & tipe tak dikenal) → popup langsung");
            return false;
        }

        // ================= POPUP =================
        function openPopup(step) {
            currentStep = step;
            stopAudio();
            hideStageCTA(); // tombol aksi disembunyikan selama popup terbuka
            document.getElementById("popup-title").textContent = step.title;
            document.getElementById("popup-desc").textContent = step.description || "";
            document.getElementById("popup-content").textContent =
                step.content || "Tidak ada konten detail untuk tahap ini.";
            document.getElementById("popup-backdrop").classList.remove("hidden");
            document.getElementById("popup-wrap").classList.remove("hidden");
        }

        function closePopup() {
            stopAudio();
            currentStep = null;
            document.getElementById("popup-backdrop").classList.add("hidden");
            document.getElementById("popup-wrap").classList.add("hidden");
            // Masih dalam mode model tahap? → tampilkan lagi tombol aksinya
            if (stageStep) showStageCTA();
        }

        // ================= AUDIO / TTS =================
        let utterance = null;

        function getIndonesianVoice() {
            const voices = window.speechSynthesis.getVoices();
            return voices.find((v) => v.lang.startsWith("id")) ||
                voices.find((v) => v.lang.startsWith("ms")) || null;
        }

        function toggleAudio() {
            const btn = document.getElementById("btn-audio");
            const stopBtn = document.getElementById("btn-stop");

            if (utterance && window.speechSynthesis.speaking) {
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                    btn.textContent = "⏸ Jeda";
                } else {
                    window.speechSynthesis.pause();
                    btn.textContent = "▶ Lanjutkan";
                }
                return;
            }

            if (!currentStep) return;
            const text = [currentStep.title, currentStep.description, currentStep.content]
                .filter(Boolean).join(". ");

            window.speechSynthesis.cancel();
            utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "id-ID";
            utterance.rate = 0.9;
            const voice = getIndonesianVoice();
            if (voice) utterance.voice = voice;
            utterance.onend = () => {
                btn.textContent = "▶ Dengarkan";
                stopBtn.classList.add("hidden");
            };
            utterance.onerror = () => {
                btn.textContent = "▶ Dengarkan";
                stopBtn.classList.add("hidden");
            };
            window.speechSynthesis.speak(utterance);
            btn.textContent = "⏸ Jeda";
            stopBtn.classList.remove("hidden");
        }

        function stopAudio() {
            if ("speechSynthesis" in window) window.speechSynthesis.cancel();
            utterance = null;
            document.getElementById("btn-audio").textContent = "▶ Dengarkan";
            document.getElementById("btn-stop").classList.add("hidden");
        }

        // ================= INIT =================
        async function init() {
            console.log("[INIT] ========== AR PAGE INIT ==========");
            console.log("[INIT] URL:", window.location.href);
            console.log("[INIT] Method slug:", cleanSlug);
            
            const sceneEl = document.getElementById("ar-scene");
            const targetEl = document.getElementById("target-entity");
            const modelEl = document.getElementById("model-entity");

            console.log("[INIT] Attaching event listeners...");

            // Attach event listeners DULU — jangan await loadFromDB dulu!
            // Kalau await loadFromDB() duluan, scene "loaded" event fires sebelum
            // listener terpasang → setupGestures() ga pernah jalan.

            sceneEl.addEventListener("arError", () => {
                showError("Gagal mengakses kamera. Aktifkan izin kamera di browser, lalu coba lagi.");
                setStatus("Kamera tidak bisa diakses");
            });

            sceneEl.addEventListener("arReady", () => {
                setStatus("Arahkan kamera ke marker AR");
            });

            targetEl.addEventListener("targetFound", () => {
                console.log("[AR] ========== TARGET FOUND ==========");
                console.log("[AR] isTracking:", isTracking, "| modelLoaded:", modelLoaded, "| modelPath:", methodCfg.modelPath);
                isTracking = true;
                hideError();
                if (!modelLoaded) {
                    console.log("[AR] Model not loaded yet. Calling loadModelFromCache()...");
                    loadModelFromCache(methodCfg.modelPath);
                } else {
                    console.log("[AR] Model already loaded. Ready for interaction.");
                    setStatus("Ketuk bagian model untuk melihat penjelasan");
                }
            });

            targetEl.addEventListener("targetLost", () => {
                isTracking = false;
                closePopup();
                hideStageModel(); // marker hilang → model tahap & tombol aksi dibersihkan
                setStatus("Arahkan kamera ke marker AR");
            });

            modelEl.addEventListener("model-loaded", () => {
                modelLoaded = true;
                const overlay = document.getElementById("model-loading-overlay");
                overlay.classList.add("fade-out");
                setTimeout(() => overlay.classList.add("hidden"), 400);

                // Auto-fit ukuran & pusatkan model (semua model jadi seragam)
                normalizeModel();

                if (isTracking) setStatus("Ketuk bagian model untuk melihat penjelasan");
            });

            modelEl.addEventListener("model-error", () => {
                var overlay = document.getElementById("model-loading-overlay");
                overlay.classList.add("hidden");
                showError("Gagal memuat model 3D. Cek koneksi internet, lalu coba lagi.");
                setStatus("Model 3D gagal dimuat");
                modelLoading = false;
            });

            sceneEl.addEventListener("loaded", () => {
                setStatus("Arahkan kamera ke marker AR");
                setupGestures();
            });

            // Load data dari DB di belakang — TANPA nge-block event listeners
            console.log("[INIT] Starting loadFromDB() in background...");
            loadFromDB();
        }

        // ================= SERVICE WORKER (cache model) =================
        console.log("[INIT] Registering service worker...");
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js")
                .then(function(reg) {
                    console.log("[SW] Registered successfully:", reg.scope);
                })
                .catch(function(err) {
                    console.error("[SW] Registration failed:", err);
                });
        } else {
            console.warn("[SW] Service Worker not supported");
        }

        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => {};
        }
        
        console.log("[INIT] Calling init()...");
        init();
    </script>
